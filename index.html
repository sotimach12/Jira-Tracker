    function RichEditor({ id, value, onChange }) {
      const editorRef = useRef(null);
      const quillRef = useRef(null);

      useEffect(() => {
        if (editorRef.current && !quillRef.current) {
          quillRef.current = new window.Quill(editorRef.current, {
            theme: 'snow',
            modules: {
              toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['link', 'image', 'clean']
              ]
            }
          });

          if (quillRef.current.root) {
            quillRef.current.root.setAttribute('spellcheck', 'true');
          }

          if (value) {
            quillRef.current.clipboard.dangerouslyPasteHTML(value);
          }

          quillRef.current.on('text-change', () => {
            const html = quillRef.current.root.innerHTML;
            onChange(html === '<p><br></p>' ? '' : html);
          });
        }
      }, []);

      return (
        <div className="w-full">
          <div ref={editorRef} id={id} />
        </div>
      );
    }

    function extractJiraID(input) {
      if (!input) return '';
      const match = input.match(/[A-Z]+-\d+/i);
      return match ? match[0].toUpperCase() : input;
    }

    function getFormattedUrl(input) {
      if (!input) return null;
      let trimmed = input.trim();
      if (!trimmed) return null;
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      return 'https://' + trimmed;
    }

    function Auth({ isResettingPassword, setIsResettingPassword }) {
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [isForgotPassword, setIsForgotPassword] = useState(false);
      const [message, setMessage] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');
        
        let error;
        if (isForgotPassword) {
          const res = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
          });
          error = res.error;
          if (!error) setMessage('Password reset link sent! Check your email.');
        } else if (isSignUp) {
          const res = await supabase.auth.signUp({ email, password });
          error = res.error;
          if (!error) setMessage('Success! You Can Now Log In.');
        } else {
          const res = await supabase.auth.signInWithPassword({ email, password });
          error = res.error;
        }

        if (error) setMessage(error.message);
        setLoading(false);
      };

      const handleUpdatePassword = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');

        const { error } = await supabase.auth.updateUser({ password: newPassword });
        if (error) {
          setMessage(error.message);
        } else {
          setMessage('Password updated successfully! Redirecting...');
          setTimeout(() => {
            setIsResettingPassword(false);
            window.location.hash = '';
          }, 1500);
        }
        setLoading(false);
      };

      if (isResettingPassword) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-gray-200 p-4">
            <div className="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-sm">
              <h2 className="text-2xl font-bold mb-4 text-center text-gray-800">Set New Password</h2>
              {message && <p className={`mb-4 text-sm text-center font-bold ${message.includes('successfully') ? 'text-green-600' : 'text-red-600'}`}>{message}</p>}
              <form onSubmit={handleUpdatePassword} className="space-y-4">
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-1">New Password</label>
                  <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 text-sm" required minLength="6" placeholder="Enter new password" />
                </div>
                <button type="submit" disabled={loading} className="w-full bg-green-600 text-white font-bold p-3 rounded hover:bg-green-700 text-sm">
                  {loading ? 'Updating...' : 'Update Password'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex items-center justify-center min-h-screen bg-gray-200 p-4">
          <div className="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 className="text-2xl sm:text-3xl font-bold mb-6 text-center text-gray-800">
              {isForgotPassword ? 'Reset Password' : isSignUp ? 'Create Account' : 'Welcome Back'}
            </h2>
            {message && <p className={`mb-4 text-sm text-center font-bold ${message.includes('sent') || message.includes('Success') ? 'text-green-600' : 'text-red-600'}`}>{message}</p>}
            
            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Email</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 text-sm" required spellCheck="true" />
              </div>
              
              {!isForgotPassword && (
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-1">Password</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 text-sm" required={!isForgotPassword} />
                </div>
              )}

              <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-700 mt-4 text-sm">
                {loading ? 'Processing...' : (isForgotPassword ? 'Send Reset Link' : isSignUp ? 'Sign Up' : 'Log In')}
              </button>
            </form>
            
            <div className="mt-6 flex flex-col items-center gap-2 text-sm text-gray-600 font-semibold">
              {!isForgotPassword && (
                <p className="cursor-pointer hover:text-blue-600" onClick={() => { setIsForgotPassword(true); setIsSignUp(false); setMessage(''); }}>
                  Forgot Password?
                </p>
              )}

              {isForgotPassword ? (
                <p className="cursor-pointer hover:text-blue-600" onClick={() => { setIsForgotPassword(false); setMessage(''); }}>
                  Back to Log In
                </p>
              ) : (
                <p className="cursor-pointer hover:text-blue-600" onClick={() => { setIsSignUp(!isSignUp); setMessage(''); }}>
                  {isSignUp ? 'Already Have An Account? Log In' : "Don't Have An Account? Sign Up"}
                </p>
              )}
            </div>
          </div>
        </div>
      );
    }

    function WorkspaceTracker({ session }) {
      const [tasks, setTasks] = useState([]);
      const [templateSpaces, setTemplateSpaces] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isNotesDrawerOpen, setIsNotesDrawerOpen] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);

      const [isMobileStack, setIsMobileStack] = useState(() => window.innerWidth < 768);

      const [currentTask, setCurrentTask] = useState(emptyTask);
      const [isLoading, setIsLoading] = useState(true);
      const [copiedId, setCopiedId] = useState(null);
      const [draggableTaskId, setDraggableTaskId] = useState(null);
      
      const modalRef = useRef(null);
      const templateModalRef = useRef(null);
      const templateListRef = useRef(null);
      const menuRef = useRef(null);

      const [quickNotes, setQuickNotes] = useState('');
      const [quickTodos, setQuickTodos] = useState([]);
      const [newTodoInput, setNewTodoInput] = useState('');
      const [newTodoDueDate, setNewTodoInputDueDate] = useState('');

      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('ALL'); 
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const [notificationPermission, setNotificationPermission] = useState(
        typeof Notification !== 'undefined' ? Notification.permission : 'default'
      );

      const [bgColor, setBgColor] = useState('bg-slate-200');
      const [colColor, setColColor] = useState(BASIC_THEME_OPTIONS[0].colValue);

      // Offline Network Status
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      // FRIDAY BACKUP PROMPT STATE
      const [showFridayPrompt, setShowFridayPrompt] = useState(false);

      useEffect(() => {
        const today = new Date();
        const isFriday = today.getDay() === 5; // 5 = Friday
        const todayStr = today.toISOString().slice(0, 10);
        const dismissedDate = localStorage.getItem('friday_prompt_dismissed');

        if (isFriday && dismissedDate !== todayStr) {
          setShowFridayPrompt(true);
        }
      }, []);

      const dismissFridayPrompt = () => {
        const todayStr = new Date().toISOString().slice(0, 10);
        localStorage.setItem('friday_prompt_dismissed', todayStr);
        setShowFridayPrompt(false);
      };

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);

        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      // Undo / Redo History State (Keyboard Driven Only)
      const [undoStack, setUndoStack] = useState([]);
      const [redoStack, setRedoStack] = useState([]);

      const pushHistory = (action) => {
        setUndoStack(prev => [...prev, action]);
        setRedoStack([]);
      };

      const handleUndo = async () => {
        if (undoStack.length === 0) return;
        const lastAction = undoStack[undoStack.length - 1];
        setUndoStack(prev => prev.slice(0, prev.length - 1));

        if (lastAction.type === 'STATUS_CHANGE') {
          setTasks(prev => prev.map(t => String(t.id) === String(lastAction.taskId) ? { ...t, status: lastAction.oldStatus } : t));
          await supabase.from('tasks').update({ status: lastAction.oldStatus }).eq('id', lastAction.taskId);
          setRedoStack(prev => [...prev, lastAction]);
        } else if (lastAction.type === 'DELETE_TASK') {
          const { data, error } = await supabase.from('tasks').insert([lastAction.taskData]).select();
          if (!error && data) {
            setTasks(prev => [data[0], ...prev]);
            setRedoStack(prev => [...prev, { ...lastAction, restoredId: data[0].id }]);
          }
        }
      };

      const handleRedo = async () => {
        if (redoStack.length === 0) return;
        const nextAction = redoStack[redoStack.length - 1];
        setRedoStack(prev => prev.slice(0, prev.length - 1));

        if (nextAction.type === 'STATUS_CHANGE') {
          setTasks(prev => prev.map(t => String(t.id) === String(nextAction.taskId) ? { ...t, status: nextAction.newStatus } : t));
          await supabase.from('tasks').update({ status: nextAction.newStatus }).eq('id', nextAction.taskId);
          setUndoStack(prev => [...prev, nextAction]);
        } else if (nextAction.type === 'DELETE_TASK') {
          const targetId = nextAction.restoredId || nextAction.taskId;
          await supabase.from('tasks').delete().eq('id', targetId);
          setTasks(prev => prev.filter(t => String(t.id) !== String(targetId)));
          setUndoStack(prev => [...prev, nextAction]);
        }
      };

      // Keyboard Shortcut listener for Cmd/Ctrl+Z and Cmd/Ctrl+Y
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;

          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
            if (e.shiftKey) {
              e.preventDefault();
              handleRedo();
            } else {
              e.preventDefault();
              handleUndo();
            }
          } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') {
            e.preventDefault();
            handleRedo();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [undoStack, redoStack]);

      useEffect(() => { 
        fetchTasks(); 
        fetchTemplates();
        fetchUserData();

        const handleResize = () => {
          if (window.innerWidth >= 768) setIsMobileStack(false);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // FORCE DATABASE SYNC HANDLER
      const forceDatabaseSync = async () => {
        setIsSyncing(true);
        await Promise.all([fetchTasks(), fetchTemplates(), fetchUserData()]);
        setTimeout(() => setIsSyncing(false), 600);
      };

      const fetchUserData = async () => {
        if (!session?.user) return;
        const userId = session.user.id;

        const { data: padData } = await supabase
          .from('user_scratchpad')
          .select('*')
          .eq('user_id', userId)
          .single();

        if (padData) {
          setQuickNotes(padData.notes || '');
          setQuickTodos(Array.isArray(padData.todos) ? padData.todos : []);
        }

        const { data: prefData } = await supabase
          .from('user_preferences')
          .select('*')
          .eq('user_id', userId)
          .single();

        if (prefData) {
          if (prefData.bg_color) setBgColor(prefData.bg_color);
          if (prefData.col_color) setColColor(prefData.col_color);
        }
      };

      const saveScratchpadToSupabase = async (newNotes, newTodos) => {
        if (!session?.user) return;
        const userId = session.user.id;
        await supabase.from('user_scratchpad').upsert({
          user_id: userId,
          notes: newNotes,
          todos: newTodos,
          updated_at: new Date().toISOString()
        });
      };

      const changeBgColor = async (colorClass) => {
        setBgColor(colorClass);
        if (!session?.user) return;
        await supabase.from('user_preferences').upsert({
          user_id: session.user.id,
          bg_color: colorClass,
          col_color: colColor,
          updated_at: new Date
