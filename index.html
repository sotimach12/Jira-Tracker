<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Tracker</title>

  <!-- CUSTOM TAB FAVICON (Pushpin Emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Quill.js Rich Text Editor CSS & JS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <style>
    .ql-toolbar.ql-snow {
      border-top-left-radius: 0.375rem;
      border-top-right-radius: 0.375rem;
      background-color: #f9fafb;
      border-color: #d1d5db;
      padding: 4px 8px;
    }
    .ql-container.ql-snow {
      border-bottom-left-radius: 0.375rem;
      border-bottom-right-radius: 0.375rem;
      border-color: #d1d5db;
      font-family: inherit;
      background-color: #ffffff;
    }
    .ql-editor {
      min-height: 90px;
      font-size: 0.875rem;
    }

    /* Soft Dark Mode Quill Editor Adjustments */
    .theme-dark .ql-toolbar.ql-snow {
      background-color: #334155;
      border-color: #475569;
      color: #f8fafc;
    }
    .theme-dark .ql-container.ql-snow {
      background-color: #1e293b;
      border-color: #475569;
      color: #f8fafc;
    }
    .theme-dark .ql-stroke {
      stroke: #cbd5e1 !important;
    }
    .theme-dark .ql-fill {
      fill: #cbd5e1 !important;
    }
    .theme-dark .ql-picker {
      color: #cbd5e1 !important;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://sjxyivhamzcmgflrraws.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Va3ZUBZzd02bDXB_3JbRLw_PgndY5gO';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COLUMNS = ['To Do', 'Active Jiras', 'Waiting Jiras', 'Parked/Paused Jiras', 'Done/Closed'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    
    // Column Border Colors
    const COLUMN_BORDER_COLORS = {
      'To Do': 'border-black',
      'Active Jiras': 'border-amber-400',
      'Waiting Jiras': 'border-slate-300',
      'Parked/Paused Jiras': 'border-purple-600',
      'Done/Closed': 'border-lime-400'
    };

    // BASIC THEME OPTIONS WITH SOFT DARK SLATE
    const BASIC_THEME_OPTIONS = [
      { name: 'Classic Slate', bgValue: 'bg-slate-200', colValue: 'bg-slate-100 border-slate-300 text-slate-900' },
      { name: 'Pure Light', bgValue: 'bg-gray-100', colValue: 'bg-white border-gray-300 text-gray-900 shadow-md' },
      { name: 'Mint Emerald', bgValue: 'bg-emerald-100', colValue: 'bg-emerald-50 border-emerald-300 text-emerald-950' },
      { name: 'Warm Sunset', bgValue: 'bg-amber-100', colValue: 'bg-amber-50 border-amber-300 text-amber-950' },
      { name: 'Indigo Velvet', bgValue: 'bg-indigo-600', colValue: 'bg-indigo-700 border-indigo-500 text-white shadow-lg' },
      { name: 'Dark Slate', bgValue: 'bg-slate-900 text-slate-100 theme-dark', colValue: 'bg-slate-800 border-slate-700 text-slate-100 shadow-xl' }
    ];

    const emptyTask = {
      title: '', jira_id: '', status: 'To Do', problem: '', searched: '',
      actions: '', notes: '', related_files: '', shelf_pages: '', qa: '',
      is_project: false,
      pipeline_month: '',
      live_date: '',
      reminder_date: '',
      reminder_note: '',
      reminder_type: 'Reminder',
      reporter_response: ''
    };

    function RichEditor({ id, value, onChange }) {
      const editorRef = useRef(null);
      const quillRef = useRef(null);

      useEffect(() => {
        if (editorRef.current && !quillRef.current) {
          quillRef.current = new window.Quill(editorRef.current, {
            theme: 'snow',
            modules: {
              toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['link', 'image', 'clean']
              ]
            }
          });

          if (quillRef.current.root) {
            quillRef.current.root.setAttribute('spellcheck', 'true');
          }

          if (value) {
            quillRef.current.clipboard.dangerouslyPasteHTML(value);
          }

          quillRef.current.on('text-change', () => {
            const html = quillRef.current.root.innerHTML;
            onChange(html === '<p><br></p>' ? '' : html);
          });
        }
      }, []);

      return (
        <div className="w-full">
          <div ref={editorRef} id={id} />
        </div>
      );
    }

    function extractJiraID(input) {
      if (!input) return '';
      const match = input.match(/[A-Z]+-\d+/i);
      return match ? match[0].toUpperCase() : input;
    }

    function getFormattedUrl(input) {
      if (!input) return null;
      let trimmed = input.trim();
      if (!trimmed) return null;
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      return 'https://' + trimmed;
    }

    function Auth() {
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [message, setMessage] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');
        
        let error;
        if (isSignUp) {
          const res = await supabase.auth.signUp({ email, password });
          error = res.error;
          if (!error) setMessage('Success! You Can Now Log In.');
        } else {
          const res = await supabase.auth.signInWithPassword({ email, password });
          error = res.error;
        }

        if (error) setMessage(error.message);
        setLoading(false);
      };

      return (
        <div className="flex items-center justify-center min-h-screen bg-gray-200">
          <div className="bg-white p-8 rounded-lg shadow-xl w-96">
            <h2 className="text-3xl font-bold mb-6 text-center text-gray-800">{isSignUp ? 'Create Account' : 'Welcome Back'}</h2>
            {message && <p className="mb-4 text-sm text-center font-bold text-red-600">{message}</p>}
            
            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Email</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required spellCheck="true" />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700 mt-4">
                {loading ? 'Processing...' : (isSignUp ? 'Sign Up' : 'Log In')}
              </button>
            </form>
            
            <p className="mt-6 text-sm text-center text-gray-600 cursor-pointer hover:text-blue-600 font-semibold" onClick={() => {setIsSignUp(!isSignUp); setMessage('');}}>
              {isSignUp ? 'Already Have An Account? Log In' : "Don't Have An Account? Sign Up"}
            </p>
          </div>
        </div>
      );
    }

    function WorkspaceTracker() {
      const [tasks, setTasks] = useState([]);
      const [templateSpaces, setTemplateSpaces] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);
      const [currentTask, setCurrentTask] = useState(emptyTask);
      const [isLoading, setIsLoading] = useState(true);
      const [copiedId, setCopiedId] = useState(null);
      
      const modalRef = useRef(null);
      const templateModalRef = useRef(null);
      const templateListRef = useRef(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('ALL'); 
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const [notificationPermission, setNotificationPermission] = useState(
        typeof Notification !== 'undefined' ? Notification.permission : 'default'
      );

      const [bgColor, setBgColor] = useState(() => {
        return localStorage.getItem('tracker_bg') || 'bg-slate-200';
      });

      const [colColor, setColColor] = useState(() => {
        return localStorage.getItem('tracker_col') || BASIC_THEME_OPTIONS[0].colValue;
      });

      useEffect(() => { 
        fetchTasks(); 
        fetchTemplates();
      }, []);

      useEffect(() => {
        if (isModalOpen) {
          if (modalRef.current) modalRef.current.scrollTop = 0;
          setTimeout(() => {
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
              document.activeElement.blur();
            }
          }, 50);
        }
      }, [isModalOpen, currentTask.id]);

      useEffect(() => {
        if (isTemplateModalOpen) {
          if (templateModalRef.current) templateModalRef.current.scrollTop = 0;
          if (templateListRef.current) templateListRef.current.scrollTop = 0;
          setTimeout(() => {
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
              document.activeElement.blur();
            }
          }, 50);
        }
      }, [isTemplateModalOpen]);

      useEffect(() => {
        const interval = setInterval(() => {
          checkAndTriggerNotifications();
        }, 10000);
        return () => clearInterval(interval);
      }, [tasks, notificationPermission]);

      const requestNotificationAccess = async () => {
        if (typeof Notification !== 'undefined') {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            new Notification("Jira Tracker Alerts Enabled!", {
              body: "You will receive desktop alerts for scheduled reminders & deadlines.",
              icon: "📌"
            });
          }
        } else {
          alert("Desktop Notifications are not supported in your browser.");
        }
      };

      const checkAndTriggerNotifications = async () => {
        if (notificationPermission !== 'granted') return;

        const now = new Date();
        for (const task of tasks) {
          if (task.reminder_date && !task.reminder_notified) {
            const remTime = new Date(task.reminder_date);
            if (remTime <= now) {
              const jiraId = extractJiraID(task.jira_id) || 'JIRA Task';
              const title = task.title || 'Task Reminder';
              const rType = task.reminder_type || 'Reminder';
              const note = task.reminder_note ? `\nNote: ${task.reminder_note}` : '';

              new Notification(`[${rType}] ${jiraId}`, {
                body: `${title}${note}`,
                icon: "📌"
              });

              await supabase.from('tasks').update({ reminder_notified: true }).eq('id', task.id);
              setTasks(prev => prev.map(t => t.id === task.id ? { ...t, reminder_notified: true } : t));
            }
          }
        }
      };

      const changeBgColor = (colorClass) => {
        setBgColor(colorClass);
        localStorage.setItem('tracker_bg', colorClass);
      };

      const changeColColor = (colorClass) => {
        setColColor(colorClass);
        localStorage.setItem('tracker_col', colorClass);
      };

      const clearReminder = () => {
        setCurrentTask(prev => ({
          ...prev,
          reminder_date: null,
          reminder_note: '',
          reminder_type: 'Reminder'
        }));
      };

      // EXPORT TO EXCEL (CSV) FORMAT
      const exportTasksCSV = () => {
        if (!tasks || tasks.length === 0) {
          alert("No tasks available to export.");
          return;
        }

        const stripHTML = (html) => {
          if (!html) return '';
          const tmp = document.createElement('DIV');
          tmp.innerHTML = html;
          return (tmp.textContent || tmp.innerText || '').replace(/"/g, '""').trim();
        };

        const headers = ["ID", "Title", "Jira Link/ID", "Status", "Pipeline Month", "Is Project", "Target Live Date", "Reminder Date", "Reminder Type", "Reminder Note", "Problem", "Searched", "Actions", "Notes", "Created At"];
        
        const csvRows = [
          headers.join(','),
          ...tasks.map(t => [
            `"${t.id || ''}"`,
            `"${(t.title || '').replace(/"/g, '""')}"`,
            `"${(t.jira_id || '').replace(/"/g, '""')}"`,
            `"${t.status || ''}"`,
            `"${t.pipeline_month || ''}"`,
            `"${t.is_project ? 'Yes' : 'No'}"`,
            `"${formatDateOnly(t.live_date)}"`,
            `"${formatDate(t.reminder_date)}"`,
            `"${t.reminder_type || ''}"`,
            `"${(t.reminder_note || '').replace(/"/g, '""')}"`,
            `"${stripHTML(t.problem)}"`,
            `"${stripHTML(t.searched)}"`,
            `"${stripHTML(t.actions)}"`,
            `"${stripHTML(t.notes)}"`,
            `"${formatDate(t.created_at)}"`
          ].join(','))
        ];

        const csvContent = "\uFEFF" + csvRows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `jira_tracker_export_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // DRAG AND DROP HANDLERS
      const handleDragStart = (e, taskId) => {
        setDraggedTaskId(taskId);
        e.dataTransfer.setData('text/plain', taskId);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = async (e, newStatus) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
        if (!id) return;

        const targetTask = tasks.find(t => String(t.id) === String(id));
        if (targetTask && targetTask.status !== newStatus) {
          setTasks(prev => prev.map(t => String(t.id) === String(id) ? { ...t, status: newStatus } : t));
          await supabase.from('tasks').update({ status: newStatus }).eq('id', id);
        }
        setDraggedTaskId(null);
      };

      const fetchTemplates = async () => {
        const { data, error } = await supabase.from('templates').select('*').order('created_at', { ascending: true });
        if (!error && data) {
          setTemplateSpaces(data);
        }
      };

      const addTemplateSpace = async () => {
        const newTemp = { title: 'New Template', body: '' };
        const { data, error } = await supabase.from('templates').insert([newTemp]).select();
        if (!error && data) {
          setTemplateSpaces(prev => [...prev, data[0]]);
        }
      };

      const updateTemplateSpace = async (id, field, value) => {
        setTemplateSpaces(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
        await supabase.from('templates').update({ [field]: value }).eq('id', id);
      };

      const removeTemplateSpace = async (id) => {
        if (window.confirm("Are you sure you want to delete this template from Supabase?")) {
          setTemplateSpaces(prev => prev.filter(s => s.id !== id));
          await supabase.from('templates').delete().eq('id', id);
        }
      };

      const copyTemplateText = async (space) => {
        const htmlContent = space.body || '';
        try {
          if (navigator.clipboard && window.ClipboardItem) {
            const blobHtml = new Blob([htmlContent], { type: 'text/html' });
            const tmp = document.createElement('div');
            tmp.innerHTML = htmlContent;
            const plainText = tmp.textContent || tmp.innerText || '';
            const blobText = new Blob([plainText], { type: 'text/plain' });

            const data = [new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })];
            await navigator.clipboard.write(data);
          } else {
            const textArea = document.createElement('textarea');
            textArea.value = htmlContent;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          }
          setCopiedId(space.id);
          setTimeout(() => setCopiedId(null), 2000);
        } catch (err) {
          alert("Failed to copy text. Please copy manually.");
        }
      };

      const fetchTasks = async () => {
        setIsLoading(true);
        const { data, error } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        if (!error) setTasks(data || []);
        setIsLoading(false);
      };

      const saveTask = async () => {
        const payload = {
          title: currentTask.title || '',
          jira_id: currentTask.jira_id || '',
          status: currentTask.status || 'To Do',
          problem: currentTask.problem || '',
          searched: currentTask.searched || '',
          actions: currentTask.actions || '',
          notes: currentTask.notes || '',
          related_files: currentTask.related_files || '',
          shelf_pages: currentTask.shelf_pages || '',
          qa: currentTask.qa || '',
          is_project: !!currentTask.is_project,
          pipeline_month: currentTask.pipeline_month || '',
          live_date: currentTask.live_date || null,
          reminder_date: currentTask.reminder_date ? new Date(currentTask.reminder_date).toISOString() : null,
          reminder_note: currentTask.reminder_note || '',
          reminder_type: currentTask.reminder_type || 'Reminder',
          reminder_notified: false,
          reporter_response: currentTask.reporter_response || ''
        };

        if (currentTask.id) {
          const { error } = await supabase.from('tasks').update(payload).eq('id', currentTask.id);
          if (error) alert("Save Failed: " + error.message);
        } else {
          const { error } = await supabase.from('tasks').insert([payload]);
          if (error) alert("Save Failed: " + error.message);
        }
        await fetchTasks();
        setIsModalOpen(false);
      };

      const deleteTask = async () => {
        if (window.confirm("Are You Sure You Want To Delete This Task? This Cannot Be Undone.")) {
          const { error } = await supabase.from('tasks').delete().eq('id', currentTask.id);
          if (error) {
            console.error("Error deleting:", error);
            alert("Failed To Delete Task.");
          } else {
            await fetchTasks();
            setIsModalOpen(false);
          }
        }
      };

      const appendNewResponse = () => {
        const timestamp = new Date().toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
        const existing = currentTask.reporter_response || '';
        const prefix = existing.trim().length > 0 ? '\n\n' : '';
        const newResponseBlock = `${prefix}========================================\nRESPONSE (${timestamp})\n========================================\n`;
        setCurrentTask(prev => ({
          ...prev,
          reporter_response: (prev.reporter_response || '') + newResponseBlock
        }));
      };

      // EUROPEAN DATE FORMATTING (DD/MM/YYYY, HH:MM)
      const formatDate = (isoString) => {
        if (!isoString) return '';
        return new Date(isoString).toLocaleString('en-GB', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
      };

      const formatDateOnly = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) {
          return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return dateString;
      };

      const formatDatetimeLocal = (isoString) => {
        if (!isoString) return '';
        const d = new Date(isoString);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
      };

      const getReminderStatus = (isoString) => {
        if (!isoString) return null;
        const remDate = new Date(isoString);
        const now = new Date();
        const todayStr = now.toDateString();
        const remStr = remDate.toDateString();

        if (remDate < now && remStr !== todayStr) {
          return 'OVERDUE';
        } else if (remStr === todayStr) {
          return 'DUE_TODAY';
        }
        return 'UPCOMING';
      };

      const filteredTasks = tasks.filter(task => {
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchesTitle = (task.title || '').toLowerCase().includes(q);
          const matchesJira = (task.jira_id || '').toLowerCase().includes(q);
          const matchesProblem = (task.problem || '').toLowerCase().includes(q);
          const matchesActions = (task.actions || '').toLowerCase().includes(q);
          const matchesNotes = (task.notes || '').toLowerCase().includes(q);
          const matchesMonth = (task.pipeline_month || '').toLowerCase().includes(q);

          if (!matchesTitle && !matchesJira && !matchesProblem && !matchesActions && !matchesNotes && !matchesMonth) {
            return false;
          }
        }

        if (filterStatus === 'PROJECTS_ONLY') return task.is_project;
        if (filterStatus === 'DUE_TODAY') return getReminderStatus(task.reminder_date) === 'DUE_TODAY';
        if (filterStatus === 'OVERDUE') return getReminderStatus(task.reminder_date) === 'OVERDUE';
        if (filterStatus === 'TYPE_DUE_DATE') return task.reminder_type === 'Due Date';
        if (filterStatus === 'TYPE_FOLLOWUP') return task.reminder_type === 'Follow-up';
        return true;
      });

      const isDarkMode = colColor.includes('bg-slate-800') || bgColor.includes('theme-dark');

      if (isLoading) return <div className="p-8 text-xl font-bold text-gray-700">Loading Your Secure Jira Tracker...</div>;

      return (
        <div className={`min-h-screen p-8 font-sans transition-colors duration-300 ${bgColor}`}>
          {/* HEADER BAR SHARES THE COLUMN THEME */}
          <div className={`flex justify-between items-center mb-8 p-4 rounded-xl shadow-lg border gap-4 transition-all ${colColor}`}>
            <div className="flex items-center gap-4">
              <div>
                <h1 className="text-3xl font-bold">Jira Tracker</h1>
                <button onClick={() => supabase.auth.signOut()} className="text-sm font-bold text-red-500 hover:text-red-700 mt-1">
                  Log Out
                </button>
              </div>

              {/* SEARCH BAR FOR ALL FIELDS */}
              <div className="relative ml-4">
                <span className="absolute inset-y-0 left-0 flex items-center pl-2.5 text-gray-400">🔍</span>
                <input 
                  type="text" 
                  placeholder="Search titles, IDs, notes, months..." 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className={`pl-8 pr-8 py-1.5 border rounded-lg text-xs w-64 focus:ring-2 focus:ring-blue-500 outline-none font-medium shadow-sm ${
                    isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-900'
                  }`}
                  spellCheck="true"
                />
                {searchQuery && (
                  <button 
                    onClick={() => setSearchQuery('')}
                    className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-xs font-bold text-gray-400 hover:text-red-500"
                  >
                    ✕
                  </button>
                )}
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* ICON-ONLY ALERT BUTTON */}
              <button 
                onClick={requestNotificationAccess}

                  <div>
                    <label className={`block text-sm font-bold mb-1 ${isDarkMode ? 'text-slate-300' : 'text-gray-700'}`}>Shelf Pages That Need Content</label>
                    <RichEditor id="editor-shelf" value={currentTask.shelf_pages || ''} onChange={val => setCurrentTask(prev => ({...prev, shelf_pages: val}))} />
                  </div>

                  <div>
                    <label className={`block text-sm font-bold mb-1 ${isDarkMode ? 'text-slate-300' : 'text-gray-700'}`}>Questions & Answers</label>
                    <RichEditor id="editor-qa" value={currentTask.qa || ''} onChange={val => setCurrentTask(prev => ({...prev, qa: val}))} />
                  </div>

                  <div className={`p-4 border rounded ${
                    isDarkMode ? 'bg-blue-950/40 border-blue-800' : 'bg-blue-50 border-blue-200'
                  }`}>
                    <div className="flex justify-between items-center mb-2">
                      <label className={`block text-sm font-bold ${isDarkMode ? 'text-blue-300' : 'text-blue-800'}`}>Response To Reporter</label>
                      <button 
                        type="button" 
                        onClick={appendNewResponse} 
                        className="text-xs bg-blue-600 text-white font-bold px-2.5 py-1 rounded hover:bg-blue-700 transition-all shadow-sm"
                      >
                        + Append Another Response
                      </button>
                    </div>
                    <textarea 
                      className={`w-full border p-2 rounded h-40 font-mono text-sm ${
                        isDarkMode ? 'bg-slate-950 border-blue-800 text-slate-100' : 'bg-white border-blue-200 text-gray-900'
                      }`} 
                      value={currentTask.reporter_response || ''} 
                      onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, reporter_response: val})); }}
                      spellCheck="true"
                    ></textarea>
                  </div>
                </div>

                <div className="mt-6 flex gap-4 border-t pt-4 border-current opacity-80">
                  {currentTask.id && (
                    <button onClick={deleteTask} className="px-4 py-2 bg-red-100 text-red-700 font-bold rounded hover:bg-red-200 mr-auto">
                      Delete Task
                    </button>
                  )}
                  <button onClick={() => setIsModalOpen(false)} className={`px-4 py-2 rounded font-bold ml-auto ${
                    isDarkMode ? 'text-slate-300 hover:bg-slate-800' : 'text-gray-600 hover:bg-gray-100'
                  }`}>Cancel</button>
                  <button onClick={saveTask} className="px-6 py-2 bg-green-600 text-white font-bold rounded hover:bg-green-700">Save Task</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(null);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => setSession(session));
        return () => subscription.unsubscribe();
      }, []);

      return !session ? <Auth /> : <WorkspaceTracker />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
