<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Jira Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Quill.js Rich Text Editor CSS & JS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <style>
    .ql-toolbar.ql-snow {
      border-top-left-radius: 0.375rem;
      border-top-right-radius: 0.375rem;
      background-color: #f9fafb;
      border-color: #d1d5db;
      padding: 4px 8px;
    }
    .ql-container.ql-snow {
      border-bottom-left-radius: 0.375rem;
      border-bottom-right-radius: 0.375rem;
      border-color: #d1d5db;
      font-family: inherit;
      background-color: #ffffff;
    }
    .ql-editor {
      min-height: 90px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://sjxyivhamzcmgflrraws.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Va3ZUBZzd02bDXB_3JbRLw_PgndY5gO';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COLUMNS = ['To Do', 'Active Jiras', 'Waiting Jiras', 'Parked/Paused Jiras', 'Done/Closed'];
    
    const UNIFIED_COLOR_OPTIONS = [
      { name: 'Mint Green', bgValue: 'bg-emerald-100', colValue: 'bg-emerald-100 border-emerald-300 text-emerald-950' },
      { name: 'Classic Gray', bgValue: 'bg-gray-100', colValue: 'bg-gray-200/90 border-gray-300 text-gray-800' },
      { name: 'Slate Blue', bgValue: 'bg-slate-200', colValue: 'bg-slate-200 border-slate-300 text-slate-900' },
      { name: 'Soft Blue', bgValue: 'bg-blue-100', colValue: 'bg-blue-100 border-blue-200 text-blue-950' },
      { name: 'Warm Amber', bgValue: 'bg-amber-100', colValue: 'bg-amber-100 border-amber-300 text-amber-950' },
      { name: 'Rose Pink', bgValue: 'bg-rose-100', colValue: 'bg-rose-100 border-rose-300 text-rose-950' },
      { name: 'Lavender', bgValue: 'bg-purple-100', colValue: 'bg-purple-100 border-purple-300 text-purple-950' },
      { name: 'Pure White', bgValue: 'bg-white', colValue: 'bg-white/95 border-gray-300 text-gray-900 shadow-md' },
      { name: 'Electric Blue', bgValue: 'bg-blue-600', colValue: 'bg-blue-600 border-blue-400 text-white shadow-lg' },
      { name: 'Deep Indigo', bgValue: 'bg-indigo-700', colValue: 'bg-indigo-700 border-indigo-500 text-white shadow-lg' },
      { name: 'Emerald Green', bgValue: 'bg-emerald-600', colValue: 'bg-emerald-600 border-emerald-400 text-white shadow-lg' },
      { name: 'Crimson Red', bgValue: 'bg-rose-600', colValue: 'bg-rose-600 border-rose-400 text-white shadow-lg' },
      { name: 'Sunset Orange', bgValue: 'bg-orange-500', colValue: 'bg-orange-500 border-orange-400 text-white shadow-lg' },
      { name: 'Golden Amber', bgValue: 'bg-amber-500', colValue: 'bg-amber-500 border-amber-600 text-amber-950 shadow-lg' },
      { name: 'Royal Violet', bgValue: 'bg-purple-700', colValue: 'bg-purple-700 border-purple-500 text-white shadow-lg' },
      { name: 'Hot Pink', bgValue: 'bg-fuchsia-600', colValue: 'bg-fuchsia-600 border-fuchsia-400 text-white shadow-lg' },
      { name: 'Deep Teal', bgValue: 'bg-teal-700', colValue: 'bg-teal-700 border-teal-500 text-white shadow-lg' },
      { name: 'Midnight Black', bgValue: 'bg-gray-950', colValue: 'bg-gray-950 border-gray-800 text-gray-100 shadow-xl' },
      { name: 'Dark Gray', bgValue: 'bg-gray-900', colValue: 'bg-gray-900 border-gray-800 text-gray-100 shadow-xl' },
      { name: 'Charcoal Blue', bgValue: 'bg-slate-900', colValue: 'bg-slate-900 border-slate-800 text-slate-100 shadow-xl' }
    ];

    const defaultResponseTemplate = 'Hello _,\n\nThank You For Raising This Inquiry.\n\n___\n\nKind Regards';

    const emptyTask = {
      title: '', jira_id: '', status: 'To Do', problem: '', searched: '',
      actions: '', notes: '', related_files: '', shelf_pages: '', qa: '',
      reporter_response: defaultResponseTemplate
    };

    function RichEditor({ id, value, onChange }) {
      const editorRef = useRef(null);
      const quillRef = useRef(null);

      useEffect(() => {
        if (editorRef.current && !quillRef.current) {
          quillRef.current = new window.Quill(editorRef.current, {
            theme: 'snow',
            modules: {
              toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['link', 'clean']
              ]
            }
          });

          if (value) {
            quillRef.current.clipboard.dangerouslyPasteHTML(value);
          }

          quillRef.current.on('text-change', () => {
            const html = quillRef.current.root.innerHTML;
            onChange(html === '<p><br></p>' ? '' : html);
          });
        }
      }, []);

      return (
        <div className="w-full">
          <div ref={editorRef} id={id} />
        </div>
      );
    }

    function extractJiraID(input) {
      if (!input) return '';
      const match = input.match(/[A-Z]+-\d+/i);
      return match ? match[0].toUpperCase() : input;
    }

    function Auth() {
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [message, setMessage] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');
        
        let error;
        if (isSignUp) {
          const res = await supabase.auth.signUp({ email, password });
          error = res.error;
          if (!error) setMessage('Success! You Can Now Log In.');
        } else {
          const res = await supabase.auth.signInWithPassword({ email, password });
          error = res.error;
        }

        if (error) setMessage(error.message);
        setLoading(false);
      };

      return (
        <div className="flex items-center justify-center min-h-screen bg-gray-200">
          <div className="bg-white p-8 rounded-lg shadow-xl w-96">
            <h2 className="text-3xl font-bold mb-6 text-center text-gray-800">{isSignUp ? 'Create Account' : 'Welcome Back'}</h2>
            {message && <p className="mb-4 text-sm text-center font-bold text-red-600">{message}</p>}
            
            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Email</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700 mt-4">
                {loading ? 'Processing...' : (isSignUp ? 'Sign Up' : 'Log In')}
              </button>
            </form>
            
            <p className="mt-6 text-sm text-center text-gray-600 cursor-pointer hover:text-blue-600 font-semibold" onClick={() => {setIsSignUp(!isSignUp); setMessage('');}}>
              {isSignUp ? 'Already Have An Account? Log In' : "Don't Have An Account? Sign Up"}
            </p>
          </div>
        </div>
      );
    }

    function WorkspaceTracker() {
      const [tasks, setTasks] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [currentTask, setCurrentTask] = useState(emptyTask);
      const [isLoading, setIsLoading] = useState(true);
      
      const [bgColor, setBgColor] = useState(() => {
        return localStorage.getItem('tracker_bg') || 'bg-blue-600';
      });

      const [colColor, setColColor] = useState(() => {
        return localStorage.getItem('tracker_col') || UNIFIED_COLOR_OPTIONS[1].colValue;
      });

      useEffect(() => { fetchTasks(); }, []);

      const changeBgColor = (colorClass) => {
        setBgColor(colorClass);
        localStorage.setItem('tracker_bg', colorClass);
      };

      const changeColColor = (colorClass) => {
        setColColor(colorClass);
        localStorage.setItem('tracker_col', colorClass);
      };

      const fetchTasks = async () => {
        setIsLoading(true);
        const { data, error } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        if (!error) setTasks(data || []);
        setIsLoading(false);
      };

      const saveTask = async () => {
        const payload = {
          title: currentTask.title || '',
          jira_id: currentTask.jira_id || '',
          status: currentTask.status || 'To Do',
          problem: currentTask.problem || '',
          searched: currentTask.searched || '',
          actions: currentTask.actions || '',
          notes: currentTask.notes || '',
          related_files: currentTask.related_files || '',
          shelf_pages: currentTask.shelf_pages || '',
          qa: currentTask.qa || '',
          reporter_response: currentTask.reporter_response || ''
        };

        if (currentTask.id) {
          const { error } = await supabase.from('tasks').update(payload).eq('id', currentTask.id);
          if (error) alert("Save Failed: " + error.message);
        } else {
          const { error } = await supabase.from('tasks').insert([payload]);
          if (error) alert("Save Failed: " + error.message);
        }
        await fetchTasks();
        setIsModalOpen(false);
      };

      const deleteTask = async () => {
        if (window.confirm("Are You Sure You Want To Delete This Task? This Cannot Be Undone.")) {
          const { error } = await supabase.from('tasks').delete().eq('id', currentTask.id);
          if (error) {
            console.error("Error deleting:", error);
            alert("Failed To Delete Task.");
          } else {
            await fetchTasks();
            setIsModalOpen(false);
          }
        }
      };

      const appendNewResponse = () => {
        const timestamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
        const newResponseBlock = `\n\n========================================\nRESPONSE (${timestamp})\n========================================\n${defaultResponseTemplate}`;
        setCurrentTask(prev => ({
          ...prev,
          reporter_response: (prev.reporter_response || '') + newResponseBlock
        }));
      };

      const formatDate = (isoString) => {
        if (!isoString) return '';
        return new Date(isoString).toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });
      };

      if (isLoading) return <div className="p-8 text-xl font-bold text-gray-700">Loading Your Secure Jira Tracker...</div>;

      return (
        <div className={`min-h-screen p-8 font-sans transition-colors duration-300 ${bgColor}`}>
          <div className="flex justify-between items-center mb-8 bg-white/90 backdrop-blur-md p-4 rounded-xl shadow-lg border border-white/20">
            <div>
              <h1 className="text-3xl font-bold text-gray-900">The Jira Tracker</h1>
              <button onClick={() => supabase.auth.signOut()} className="text-sm font-bold text-red-600 hover:text-red-800 mt-1">
                Securely Log Out
              </button>
            </div>

            <div className="flex items-center gap-6">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-gray-700 uppercase">Page Theme:</span>
                <select 
                  value={bgColor} 
                  onChange={e => changeBgColor(e.target.value)}
                  className="border border-gray-300 rounded px-2 py-1 text-sm bg-white font-medium focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer"
                >
                  {UNIFIED_COLOR_OPTIONS.map(c => (
                    <option key={c.name} value={c.bgValue}>{c.name}</option>
                  ))}
                </select>
              </div>

              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-gray-700 uppercase">Columns:</span>
                <select 
                  value={colColor} 
                  onChange={e => changeColColor(e.target.value)}
                  className="border border-gray-300 rounded px-2 py-1 text-sm bg-white font-medium focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer"
                >
                  {UNIFIED_COLOR_OPTIONS.map(c => (
                    <option key={c.name} value={c.colValue}>{c.name}</option>
                  ))}
                </select>
              </div>

              <button onClick={() => { setCurrentTask({ ...emptyTask }); setIsModalOpen(true); }} className="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 font-bold transition-all">
                + New Jira Task
              </button>
            </div>
          </div>

          <div className="flex gap-6 overflow-x-auto pb-4">
            {COLUMNS.map(column => (
              <div key={column} className={`rounded-xl p-4 w-80 flex-shrink-0 min-h-[500px] border transition-all ${colColor}`}>
                <h2 className="font-bold mb-4 border-b pb-2 text-sm border-current opacity-90">
                  {column} ({tasks.filter(t => t.status === column).length})
                </h2>
                <div className="space-y-4">
                  {tasks.filter(t => t.status === column).map(task => (
                    <div key={task.id} className="bg-white p-4 rounded-lg shadow cursor-pointer hover:shadow-lg border-l-4 border-blue-600 transition-all transform hover:-translate-y-0.5" onClick={() => { setCurrentTask(task); setIsModalOpen(true); }}>
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-xs font-bold text-blue-600 truncate max-w-[140px]">{extractJiraID(task.jira_id)}</span>
                        <span className="text-[10px] text-gray-400">{formatDate(task.created_at)}</span>
                      </div>
                      <div className="font-semibold text-gray-900 line-clamp-2">{task.title || 'Untitled Task'}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-6 border-b pb-4">
                  <div>
                    <h2 className="text-2xl font-bold text-gray-900">Document Template</h2>
                    {currentTask.created_at && (
                      <p className="text-xs text-gray-500 mt-1">Created: {formatDate(currentTask.created_at)}</p>
                    )}
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-500 hover:text-red-500 font-bold text-xl">✕</button>
                </div>
                <div className="space-y-6">
                  <div className="flex gap-4">
                    <div className="flex-1">
                      <label className="block text-sm font-bold text-gray-700 mb-1">Title</label>
                      <input type="text" className="w-full border border-gray-300 p-2 rounded" value={currentTask.title || ''} onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, title: val})); }} />
                    </div>
                    <div className="w-1/3">
                      <label className="block text-sm font-bold text-gray-700 mb-1">Jira Link/ID</label>
                      <input type="text" className="w-full border border-gray-300 p-2 rounded" value={currentTask.jira_id || ''} onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, jira_id: val})); }} />
                    </div>
                    <div className="w-1/3">
                      <label className="block text-sm font-bold text-gray-700 mb-1">Status</label>
                      <select className="w-full border border-gray-300 p-2 rounded" value={currentTask.status || 'To Do'} onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, status: val})); }}>
                        {COLUMNS.map(col => <option key={col} value={col}>{col}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">What's The Problem Or Task</label>
                    <RichEditor id="editor-problem" value={currentTask.problem || ''} onChange={val => setCurrentTask(prev => ({...prev, problem: val}))} />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Where I Searched</label>
                    <RichEditor id="editor-searched" value={currentTask.searched || ''} onChange={val => setCurrentTask(prev => ({...prev, searched: val}))} />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Actions</label>
                    <RichEditor id="editor-actions" value={currentTask.actions || ''} onChange={val => setCurrentTask(prev => ({...prev, actions: val}))} />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">Notes</label>
                      <RichEditor id="editor-notes" value={currentTask.notes || ''} onChange={val => setCurrentTask(prev => ({...prev, notes: val}))} />
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">Related Files</label>
                      <RichEditor id="editor-related" value={currentTask.related_files || ''} onChange={val => setCurrentTask(prev => ({...prev, related_files: val}))} />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Shelf Pages That Need Content</label>
                    <RichEditor id="editor-shelf" value={currentTask.shelf_pages || ''} onChange={val => setCurrentTask(prev => ({...prev, shelf_pages: val}))} />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Questions & Answers</label>
                    <RichEditor id="editor-qa" value={currentTask.qa || ''} onChange={val => setCurrentTask(prev => ({...prev, qa: val}))} />
                  </div>

                  <div className="bg-blue-50 p-4 border border-blue-200 rounded">
                    <div className="flex justify-between items-center mb-2">
                      <label className="block text-sm font-bold text-blue-800">Response To Reporter</label>
                      <button 
                        type="button" 
                        onClick={appendNewResponse} 
                        className="text-xs bg-blue-600 text-white font-bold px-2.5 py-1 rounded hover:bg-blue-700 transition-all shadow-sm"
                      >
                        + Append Another Response
                      </button>
                    </div>
                    <textarea 
                      className="w-full border border-blue-200 p-2 rounded h-40 font-mono text-sm bg-white" 
                      value={currentTask.reporter_response || ''} 
                      onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, reporter_response: val})); }}
                    ></textarea>
                  </div>
                </div>

                <div className="mt-6 flex gap-4 border-t pt-4">
                  {currentTask.id && (
                    <button onClick={deleteTask} className="px-4 py-2 bg-red-100 text-red-700 font-bold rounded hover:bg-red-200 mr-auto">
                      Delete Task
                    </button>
                  )}
                  <button onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-bold ml-auto">Cancel</button>
                  <button onClick={saveTask} className="px-6 py-2 bg-green-600 text-white font-bold rounded hover:bg-green-700">Save Task</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(null);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => setSession(session));
        return () => subscription.unsubscribe();
      }, []);

      return !session ? <Auth /> : <WorkspaceTracker />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
