    function RichEditor({ id, value, onChange }) {
      const editorRef = useRef(null);
      const quillRef = useRef(null);

      useEffect(() => {
        if (editorRef.current && !quillRef.current) {
          quillRef.current = new window.Quill(editorRef.current, {
            theme: 'snow',
            modules: {
              toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['link', 'image', 'clean']
              ]
            }
          });

          if (quillRef.current.root) {
            quillRef.current.root.setAttribute('spellcheck', 'true');
          }

          if (value) {
            quillRef.current.clipboard.dangerouslyPasteHTML(value);
          }

          quillRef.current.on('text-change', () => {
            const html = quillRef.current.root.innerHTML;
            onChange(html === '<p><br></p>' ? '' : html);
          });
        }
      }, []);

      return (
        <div className="w-full">
          <div ref={editorRef} id={id} />
        </div>
      );
    }

    function extractJiraID(input) {
      if (!input) return '';
      const match = input.match(/[A-Z]+-\d+/i);
      return match ? match[0].toUpperCase() : input;
    }

    function getFormattedUrl(input) {
      if (!input) return null;
      let trimmed = input.trim();
      if (!trimmed) return null;
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      return 'https://' + trimmed;
    }

    function Auth({ isResettingPassword, setIsResettingPassword }) {
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [isForgotPassword, setIsForgotPassword] = useState(false);
      const [message, setMessage] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');
        
        let error;
        if (isForgotPassword) {
          const res = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
          });
          error = res.error;
          if (!error) setMessage('Password reset link sent! Check your email.');
        } else if (isSignUp) {
          const res = await supabase.auth.signUp({ email, password });
          error = res.error;
          if (!error) setMessage('Success! You Can Now Log In.');
        } else {
          const res = await supabase.auth.signInWithPassword({ email, password });
          error = res.error;
        }

        if (error) setMessage(error.message);
        setLoading(false);
      };

      const handleUpdatePassword = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');

        const { error } = await supabase.auth.updateUser({ password: newPassword });
        if (error) {
          setMessage(error.message);
        } else {
          setMessage('Password updated successfully! Redirecting...');
          setTimeout(() => {
            setIsResettingPassword(false);
            window.location.hash = '';
          }, 1500);
        }
        setLoading(false);
      };

      if (isResettingPassword) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-gray-200 p-4">
            <div className="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-sm">
              <h2 className="text-2xl font-bold mb-4 text-center text-gray-800">Set New Password</h2>
              {message && <p className={`mb-4 text-sm text-center font-bold ${message.includes('successfully') ? 'text-green-600' : 'text-red-600'}`}>{message}</p>}
              <form onSubmit={handleUpdatePassword} className="space-y-4">
                <div>
                  <label className="block text-sm font-bold text-gray-700 mb-1">New Password</label>
                  <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 text-sm" required minLength="6" placeholder="Enter new password" />
                </div>
                <button type="submit" disabled={loading} className="w-full bg-green-600 text-white font-bold p-3 rounded hover:bg-green-700 text-sm">
                  {loading ? 'Updating...' : 'Update Password'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="flex items-center justify-center min-h-screen bg-gray-200 p-4">
          <div className="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 className="text-2xl sm:text-3xl font-bold mb-6 text-center text-gray-800">
              {isForgotPassword ? 'Reset Password' : isSignUp ? 'Create Account' : 'Welcome Back'}
            </h2>
