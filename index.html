<!DOCTYPE html>

<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://sjxyivhamzcmgflrraws.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Va3ZUBZzd02bDXB_3JbRLw_PgndY5gO';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COLUMNS = ['To Do', 'Active Jiras', 'Waiting Jiras', 'Parked/Paused Jiras', 'Done/Closed'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    
    // Column Border Colors
    const COLUMN_BORDER_COLORS = {
      'To Do': 'border-l-black',
      'Active Jiras': 'border-l-amber-400',
      'Waiting Jiras': 'border-l-slate-300',
      'Parked/Paused Jiras': 'border-l-purple-600',
      'Done/Closed': 'border-l-lime-400'
    };

    // BASIC THEME OPTIONS
    const BASIC_THEME_OPTIONS = [
      { name: 'Classic Slate', bgValue: 'bg-slate-200', colValue: 'bg-slate-100 border-slate-300 text-slate-900' },
      { name: 'Pure Light', bgValue: 'bg-gray-100', colValue: 'bg-white border-gray-300 text-gray-900 shadow-md' },
      { name: 'Mint Emerald', bgValue: 'bg-emerald-100', colValue: 'bg-emerald-50 border-emerald-300 text-emerald-950' },
      { name: 'Warm Sunset', bgValue: 'bg-amber-100', colValue: 'bg-amber-50 border-amber-300 text-amber-950' },
      { name: 'Indigo Velvet', bgValue: 'bg-indigo-600', colValue: 'bg-indigo-700 border-indigo-500 text-white shadow-lg' },
      { name: 'Dark Slate', bgValue: 'bg-slate-900 text-slate-100 theme-dark', colValue: 'bg-slate-800 border-slate-700 text-slate-100 shadow-xl' }
    ];

    const emptyTask = {
      title: '', jira_id: '', status: 'To Do', problem: '', searched: '',
      actions: '', notes: '', related_files: '', shelf_pages: '', qa: '',
      is_project: false,
      pipeline_month: '',
      live_date: '',
      reminders: [],
      reporter_response: ''
    };

    function RichEditor({ id, value, onChange }) {
      const editorRef = useRef(null);
      const quillRef = useRef(null);

      useEffect(() => {
        if (editorRef.current && !quillRef.current) {
          quillRef.current = new window.Quill(editorRef.current, {
            theme: 'snow',
            modules: {
              toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['link', 'image', 'clean']
              ]
            }
          });

          if (quillRef.current.root) {
            quillRef.current.root.setAttribute('spellcheck', 'true');
          }

          if (value) {
            quillRef.current.clipboard.dangerouslyPasteHTML(value);
          }

          quillRef.current.on('text-change', () => {
            const html = quillRef.current.root.innerHTML;
            onChange(html === '<p><br></p>' ? '' : html);
          });
        }
      }, []);

      return (
        <div className="w-full">
          <div ref={editorRef} id={id} />
        </div>
      );
    }

    function extractJiraID(input) {
      if (!input) return '';
      const match = input.match(/[A-Z]+-\d+/i);
      return match ? match[0].toUpperCase() : input;
    }

    function getFormattedUrl(input) {
      if (!input) return null;
      let trimmed = input.trim();
      if (!trimmed) return null;
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      return 'https://' + trimmed;
    }

    function Auth() {
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [message, setMessage] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');
        
        let error;
        if (isSignUp) {
          const res = await supabase.auth.signUp({ email, password });
          error = res.error;
          if (!error) setMessage('Success! You Can Now Log In.');
        } else {
          const res = await supabase.auth.signInWithPassword({ email, password });
          error = res.error;
        }

        if (error) setMessage(error.message);
        setLoading(false);
      };

      return (
        <div className="flex items-center justify-center min-h-screen bg-gray-200 p-4">
          <div className="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 className="text-2xl sm:text-3xl font-bold mb-6 text-center text-gray-800">{isSignUp ? 'Create Account' : 'Welcome Back'}</h2>
            {message && <p className="mb-4 text-sm text-center font-bold text-red-600">{message}</p>}
            
            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Email</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 text-sm" required spellCheck="true" />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2.5 rounded focus:ring-2 focus:ring-blue-500 text-sm" required />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-700 mt-4 text-sm">
                {loading ? 'Processing...' : (isSignUp ? 'Sign Up' : 'Log In')}
              </button>
            </form>
            
            <p className="mt-6 text-sm text-center text-gray-600 cursor-pointer hover:text-blue-600 font-semibold" onClick={() => {setIsSignUp(!isSignUp); setMessage('');}}>
              {isSignUp ? 'Already Have An Account? Log In' : "Don't Have An Account? Sign Up"}
            </p>
          </div>
        </div>
      );
    }

    function WorkspaceTracker({ session }) {
      const [tasks, setTasks] = useState([]);
      const [templateSpaces, setTemplateSpaces] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [isNotesDrawerOpen, setIsNotesDrawerOpen] = useState(false);

      // MOBILE VIEW TOGGLE (STACKED LIST VS KANBAN SWIPE)
      const [isMobileStack, setIsMobileStack] = useState(() => window.innerWidth < 768);

      const [currentTask, setCurrentTask] = useState(emptyTask);
      const [isLoading, setIsLoading] = useState(true);
      const [copiedId, setCopiedId] = useState(null);
      const [draggableTaskId, setDraggableTaskId] = useState(null);
      
      const modalRef = useRef(null);
      const templateModalRef = useRef(null);
      const templateListRef = useRef(null);
      const menuRef = useRef(null);

      // USER SCRATCHPAD & PREFERENCES (SUPABASE SYNCED)
      const [quickNotes, setQuickNotes] = useState('');
      const [quickTodos, setQuickTodos] = useState([]);
      const [newTodoInput, setNewTodoInput] = useState('');
      const [newTodoDueDate, setNewTodoInputDueDate] = useState('');

      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('ALL'); 
      const [draggedTaskId, setDraggedTaskId] = useState(null);
      const [notificationPermission, setNotificationPermission] = useState(
        typeof Notification !== 'undefined' ? Notification.permission : 'default'
      );

      const [bgColor, setBgColor] = useState('bg-slate-200');
      const [colColor, setColColor] = useState(BASIC_THEME_OPTIONS[0].colValue);

      useEffect(() => { 
        fetchTasks(); 
        fetchTemplates();
        fetchUserData();

        const handleResize = () => {
          if (window.innerWidth >= 768) setIsMobileStack(false);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // FETCH USER SCRATCHPAD AND PREFERENCES FROM SUPABASE
      const fetchUserData = async () => {
        if (!session?.user) return;
        const userId = session.user.id;

        // Fetch User Scratchpad
        const { data: padData } = await supabase
          .from('user_scratchpad')
          .select('*')
          .eq('user_id', userId)
          .single();

        if (padData) {
          setQuickNotes(padData.notes || '');
          setQuickTodos(Array.isArray(padData.todos) ? padData.todos : []);
        }

        // Fetch User Preferences (Themes)
        const { data: prefData } = await supabase
          .from('user_preferences')
          .select('*')
          .eq('user_id', userId)
          .single();

        if (prefData) {
          if (prefData.bg_color) setBgColor(prefData.bg_color);
          if (prefData.col_color) setColColor(prefData.col_color);
        }
      };

      // SAVE SCRATCHPAD TO SUPABASE
      const saveScratchpadToSupabase = async (newNotes, newTodos) => {
        if (!session?.user) return;
        const userId = session.user.id;
        await supabase.from('user_scratchpad').upsert({
          user_id: userId,
          notes: newNotes,
          todos: newTodos,
          updated_at: new Date().toISOString()
        });
      };

      // SAVE THEME PREFERENCES TO SUPABASE
      const changeBgColor = async (colorClass) => {
        setBgColor(colorClass);
        if (!session?.user) return;
        await supabase.from('user_preferences').upsert({
          user_id: session.user.id,
          bg_color: colorClass,
          col_color: colColor,
          updated_at: new Date().toISOString()
        });
      };

      const changeColColor = async (colorClass) => {
        setColColor(colorClass);
        if (!session?.user) return;
        await supabase.from('user_preferences').upsert({
          user_id: session.user.id,
          bg_color: bgColor,
          col_color: colorClass,
          updated_at: new Date().toISOString()
        });
      };

      // HELPER: CHECK IF A SCRATCHPAD TODO IS DUE WITHIN 7 DAYS OR OVERDUE
      const isTodoWithinSevenDaysOrOverdue = (dueDateStr) => {
        if (!dueDateStr) return false;
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        
        const due = new Date(dueDateStr);
        due.setHours(0, 0, 0, 0);

        const diffTime = due.getTime() - now.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        return diffDays <= 7;
      };

      // CHECK IF ANY INCOMPLETE SCRATCHPAD TASK HAS AN URGENT DUE DATE (<= 7 DAYS)
      const hasUrgentScratchpadTodo = quickTodos.some(t => !t.done && isTodoWithinSevenDaysOrOverdue(t.dueDate));

      // SCRATCHPAD ACTIONS
      const handleNotesChange = (e) => {
        const val = e.target.value;
        setQuickNotes(val);
        saveScratchpadToSupabase(val, quickTodos);
      };

      const addQuickTodo = (e) => {
        e.preventDefault();
        if (!newTodoInput.trim()) return;
        const updated = [
          ...quickTodos, 
          { id: Date.now(), text: newTodoInput.trim(), dueDate: newTodoDueDate || null, done: false }
        ];
        setQuickTodos(updated);
        setNewTodoInput('');
        setNewTodoInputDueDate('');
        saveScratchpadToSupabase(quickNotes, updated);
      };

      const toggleQuickTodo = (id) => {
        const updated = quickTodos.map(t => t.id === id ? { ...t, done: !t.done } : t);
        setQuickTodos(updated);
        saveScratchpadToSupabase(quickNotes, updated);
      };

      const removeQuickTodo = (id) => {
        const updated = quickTodos.filter(t => t.id !== id);
        setQuickTodos(updated);
        saveScratchpadToSupabase(quickNotes, updated);
      };

      // CLOSE MENU WHEN CLICKING OUTSIDE
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (menuRef.current && !menuRef.current.contains(e.target)) {
            setIsMenuOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      useEffect(() => {
        if (isModalOpen) {
          if (modalRef.current) modalRef.current.scrollTop = 0;
          setTimeout(() => {
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
              document.activeElement.blur();
            }
          }, 50);
        }
      }, [isModalOpen, currentTask.id]);

      useEffect(() => {
        const interval = setInterval(() => {
          checkAndTriggerNotifications();
        }, 10000);
        return () => clearInterval(interval);
      }, [tasks, notificationPermission]);

      const requestNotificationAccess = async () => {
        if (typeof Notification !== 'undefined') {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') {
            new Notification("Jira Tracker Alerts Enabled!", {
              body: "You will receive desktop alerts for scheduled reminders & deadlines.",
              icon: "📌"
            });
          }
        } else {
          alert("Desktop Notifications are not supported in your browser.");
        }
      };

      const checkAndTriggerNotifications = async () => {
        if (notificationPermission !== 'granted') return;

        const now = new Date();
        for (const task of tasks) {
          const list = task.reminders || [];
          let updated = false;

          const newReminders = list.map(rem => {
            if (rem.date && !rem.notified) {
              const remTime = new Date(rem.date);
              if (remTime <= now) {
                const jiraId = extractJiraID(task.jira_id) || 'JIRA Task';
                const title = task.title || 'Task Reminder';
                const rType = rem.type || 'Reminder';
                const note = rem.note ? `\nNote: ${rem.note}` : '';

                new Notification(`[${rType}] ${jiraId}`, {
                  body: `${title}${note}`,
                  icon: "📌"
                });

                updated = true;
                return { ...rem, notified: true };
              }
            }
            return rem;
          });

          if (updated) {
            await supabase.from('tasks').update({ reminders: newReminders }).eq('id', task.id);
            setTasks(prev => prev.map(t => t.id === task.id ? { ...t, reminders: newReminders } : t));
          }
        }
      };

      // MULTI-REMINDER MANAGEMENT
      const addReminder = () => {
        setCurrentTask(prev => ({
          ...prev,
          reminders: [
            ...(prev.reminders || []),
            { id: Date.now(), date: '', type: 'Reminder', note: '', notified: false }
          ]
        }));
      };

      const updateReminder = (id, field, value) => {
        setCurrentTask(prev => ({
          ...prev,
          reminders: (prev.reminders || []).map(r => r.id === id ? { ...r, [field]: value } : r)
        }));
      };

      const removeReminder = (id) => {
        setCurrentTask(prev => ({
          ...prev,
          reminders: (prev.reminders || []).filter(r => r.id !== id)
        }));
      };

      // EXPORT TO EXCEL (CSV) FORMAT
      const exportTasksCSV = () => {
        if (!tasks || tasks.length === 0) {
          alert("No tasks available to export.");
          return;
        }

        const stripHTML = (html) => {
          if (!html) return '';
          const tmp = document.createElement('DIV');
          tmp.innerHTML = html;
          return (tmp.textContent || tmp.innerText || '').replace(/"/g, '""').trim();
        };

        const headers = ["ID", "Title", "Jira Link/ID", "Status", "Pipeline Month", "Is Project", "Target Live Date", "Reminders Count", "Problem", "Searched", "Actions", "Notes", "Created At"];
        
        const csvRows = [
          headers.join(','),
          ...tasks.map(t => [
            `"${t.id || ''}"`,
            `"${(t.title || '').replace(/"/g, '""')}"`,
            `"${(t.jira_id || '').replace(/"/g, '""')}"`,
            `"${t.status || ''}"`,
            `"${t.pipeline_month || ''}"`,
            `"${t.is_project ? 'Yes' : 'No'}"`,
            `"${formatDateOnly(t.live_date)}"`,
            `"${(t.reminders || []).length}"`,
            `"${stripHTML(t.problem)}"`,
            `"${stripHTML(t.searched)}"`,
            `"${stripHTML(t.actions)}"`,
            `"${stripHTML(t.notes)}"`,
            `"${formatDate(t.created_at)}"`
          ].join(','))
        ];

        const csvContent = "\uFEFF" + csvRows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `jira_tracker_export_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // DRAG AND DROP HANDLERS WITH STRICT DRAG-HANDLE ACTIVATION
      const handleDragStart = (e, taskId) => {
        if (draggableTaskId !== taskId) {
          e.preventDefault();
          return;
        }
        setDraggedTaskId(taskId);
        e.dataTransfer.setData('text/plain', taskId);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = async (e, newStatus) => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
        if (!id) return;

        const targetTask = tasks.find(t => String(t.id) === String(id));
        if (targetTask && targetTask.status !== newStatus) {
          setTasks(prev => prev.map(t => String(t.id) === String(id) ? { ...t, status: newStatus } : t));
          await supabase.from('tasks').update({ status: newStatus }).eq('id', id);
        }
        setDraggedTaskId(null);
        setDraggableTaskId(null);
      };

      const fetchTemplates = async () => {
        const { data, error } = await supabase.from('templates').select('*').order('created_at', { ascending: true });
        if (!error && data) {
          setTemplateSpaces(data);
        }
      };

      const addTemplateSpace = async () => {
        const newTemp = { title: 'New Template', body: '' };
        const { data, error } = await supabase.from('templates').insert([newTemp]).select();
        if (!error && data) {
          setTemplateSpaces(prev => [...prev, data[0]]);
        }
      };

      const updateTemplateSpace = async (id, field, value) => {
        setTemplateSpaces(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
        await supabase.from('templates').update({ [field]: value }).eq('id', id);
      };

      const removeTemplateSpace = async (id) => {
        if (window.confirm("Are you sure you want to delete this template from Supabase?")) {
          setTemplateSpaces(prev => prev.filter(s => s.id !== id));
          await supabase.from('templates').delete().eq('id', id);
        }
      };

      const copyTemplateText = async (space) => {
        const htmlContent = space.body || '';
        try {
          if (navigator.clipboard && window.ClipboardItem) {
            const blobHtml = new Blob([htmlContent], { type: 'text/html' });
            const tmp = document.createElement('div');
            tmp.innerHTML = htmlContent;
            const plainText = tmp.textContent || tmp.innerText || '';
            const blobText = new Blob([plainText], { type: 'text/plain' });

            const data = [new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })];
            await navigator.clipboard.write(data);
          } else {
            const textArea = document.createElement('textarea');
            textArea.value = htmlContent;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          }
          setCopiedId(space.id);
          setTimeout(() => setCopiedId(null), 2000);
        } catch (err) {
          alert("Failed to copy text. Please copy manually.");
        }
      };

      const fetchTasks = async () => {
        setIsLoading(true);
        const { data, error } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        if (!error && data) {
          const normalized = data.map(t => {
            let list = t.reminders;
            if (!Array.isArray(list)) {
              list = [];
              if (t.reminder_date) {
                list.push({
                  id: Date.now(),
                  date: t.reminder_date,
                  type: t.reminder_type || 'Reminder',
                  note: t.reminder_note || '',
                  notified: !!t.reminder_notified
                });
              }
            }
            return { ...t, reminders: list };
          });
          setTasks(normalized);
        }
        setIsLoading(false);
      };

      const saveTask = async () => {
        const payload = {
          title: currentTask.title || '',
          jira_id: currentTask.jira_id || '',
          status: currentTask.status || 'To Do',
          problem: currentTask.problem || '',
          searched: currentTask.searched || '',
          actions: currentTask.actions || '',
          notes: currentTask.notes || '',
          related_files: currentTask.related_files || '',
          shelf_pages: currentTask.shelf_pages || '',
          qa: currentTask.qa || '',
          is_project: !!currentTask.is_project,
          pipeline_month: currentTask.pipeline_month || '',
          live_date: currentTask.live_date || null,
          reminders: (currentTask.reminders || []).map(r => ({
            ...r,
            date: r.date ? new Date(r.date).toISOString() : ''
          })),
          reporter_response: currentTask.reporter_response || ''
        };

        if (currentTask.id) {
          const { error } = await supabase.from('tasks').update(payload).eq('id', currentTask.id);
          if (error) alert("Save Failed: " + error.message);
        } else {
          const { error } = await supabase.from('tasks').insert([payload]);
          if (error) alert("Save Failed: " + error.message);
        }
        await fetchTasks();
        setIsModalOpen(false);
      };

      const deleteTask = async () => {
        if (window.confirm("Are You Sure You Want To Delete This Task? This Cannot Be Undone.")) {
          const { error } = await supabase.from('tasks').delete().eq('id', currentTask.id);
          if (error) {
            console.error("Error deleting:", error);
            alert("Failed To Delete Task.");
          } else {
            await fetchTasks();
            setIsModalOpen(false);
          }
        }
      };

      const appendNewResponse = () => {
        const timestamp = new Date().toLocaleString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
        const existing = currentTask.reporter_response || '';
        const prefix = existing.trim().length > 0 ? '\n\n' : '';
        const newResponseBlock = `${prefix}========================================\nRESPONSE (${timestamp})\n========================================\n`;
        setCurrentTask(prev => ({
          ...prev,
          reporter_response: (prev.reporter_response || '') + newResponseBlock
        }));
      };

      // EUROPEAN DATE FORMATTING (DD/MM/YYYY, HH:MM)
      const formatDate = (isoString) => {
        if (!isoString) return '';
        return new Date(isoString).toLocaleString('en-GB', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
      };

      const formatDateOnly = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) {
          return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return dateString;
      };

      const formatDatetimeLocal = (isoString) => {
        if (!isoString) return '';
        const d = new Date(isoString);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 16);
      };

      const getReminderStatus = (isoString) => {
        if (!isoString) return null;
        const remDate = new Date(isoString);
        const now = new Date();
        const todayStr = now.toDateString();
        const remStr = remDate.toDateString();

        if (remDate < now && remStr !== todayStr) {
          return 'OVERDUE';
        } else if (remStr === todayStr) {
          return 'DUE_TODAY';
        }
        return 'UPCOMING';
      };

      const getTaskHighestReminderStatus = (reminders) => {
        const list = reminders || [];
        let hasOverdue = false;
        let hasToday = false;

        for (const r of list) {
          const st = getReminderStatus(r.date);
          if (st === 'OVERDUE') hasOverdue = true;
          if (st === 'DUE_TODAY') hasToday = true;
        }

        if (hasOverdue) return 'OVERDUE';
        if (hasToday) return 'DUE_TODAY';
        return list.length > 0 ? 'UPCOMING' : null;
      };

      const filteredTasks = tasks.filter(task => {
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const matchesTitle = (task.title || '').toLowerCase().includes(q);
          const matchesJira = (task.jira_id || '').toLowerCase().includes(q);
          const matchesProblem = (task.problem || '').toLowerCase().includes(q);
          const matchesActions = (task.actions || '').toLowerCase().includes(q);
          const matchesNotes = (task.notes || '').toLowerCase().includes(q);
          const matchesMonth = (task.pipeline_month || '').toLowerCase().includes(q);

          if (!matchesTitle && !matchesJira && !matchesProblem && !matchesActions && !matchesNotes && !matchesMonth) {
            return false;
          }
        }

        const taskReminders = task.reminders || [];
        if (filterStatus === 'PROJECTS_ONLY') return task.is_project;
        if (filterStatus === 'DUE_TODAY') return taskReminders.some(r => getReminderStatus(r.date) === 'DUE_TODAY');
        if (filterStatus === 'OVERDUE') return taskReminders.some(r => getReminderStatus(r.date) === 'OVERDUE');
        if (filterStatus === 'TYPE_DUE_DATE') return taskReminders.some(r => r.type === 'Due Date');
        if (filterStatus === 'TYPE_FOLLOWUP') return taskReminders.some(r => r.type === 'Follow-up');
        return true;
      });

      const activeTasksCount = tasks.filter(t => t.status !== 'Done/Closed').length;
      const isDarkMode = colColor.includes('bg-slate-800') || bgColor.includes('theme-dark');

      if (isLoading) return <div className="p-8 text-xl font-bold text-gray-700">Loading Your Secure Jira Tracker...</div>;

      return (
        <div className={`min-h-screen p-3 sm:p-8 font-sans transition-colors duration-300 ${bgColor} relative overflow-x-hidden`}>
          
          {/* FLOATING SIDE SCRATCHPAD BUTTON WITH ANIMATED RED PULSE ALERT */}
          <button 
            onClick={() => setIsNotesDrawerOpen(true)}
            className={`fixed right-0 top-1/3 z-40 text-white font-bold text-xs py-3 px-2 rounded-l-lg shadow-xl flex flex-col items-center gap-1.5 transition-all ${
              hasUrgentScratchpadTodo 
                ? 'bg-red-600 animate-pulse ring-2 ring-red-400' 
                : 'bg-indigo-600 hover:bg-indigo-700'
            }`}
            title={hasUrgentScratchpadTodo ? "Warning: Non-Jira tasks due within 7 days or overdue!" : "Open Personal Scratchpad & Non-Jira Tasks"}
          >
            <span className="text-base">{hasUrgentScratchpadTodo ? '⚠️' : '📝'}</span>
            <span className="[writing-mode:vertical-lr] rotate-180 tracking-wider uppercase font-semibold text-[10px]">Scratchpad</span>
          </button>

          {/* SLIDE-OUT SCRATCHPAD DRAWER OVERLAY */}
          {isNotesDrawerOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex justify-end">
              <div className="bg-white w-80 sm:w-96 h-full shadow-2xl p-4 sm:p-6 flex flex-col space-y-6 border-l border-gray-200 overflow-x-hidden">
                <div className="flex justify-between items-center border-b pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📝</span>
                    <h2 className="text-lg sm:text-xl font-bold text-gray-900">Personal Scratchpad</h2>
                  </div>
                  <button onClick={() => setIsNotesDrawerOpen(false)} className="text-gray-400 hover:text-red-500 font-bold text-xl">✕</button>
                </div>

                {/* QUICK NON-JIRA TO-DO LIST WITH AUTO-EXPANDING TEXTAREA */}
                <div className="space-y-3 min-w-0">
                  <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider">Quick Non-Jira Tasks</h3>
                  <form onSubmit={addQuickTodo} className="flex flex-col gap-2">
                    <textarea 
                      value={newTodoInput} 
                      onChange={e => setNewTodoInput(e.target.value)}
                      placeholder="Add task (e.g. Ping Slack)..." 
                      rows="2"
                      className="w-full border border-gray-300 rounded p-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-gray-900 bg-white resize-y font-sans leading-relaxed break-words"
                    />
                    <div className="flex gap-2 items-center">
                      <input 
                        type="date" 
                        value={newTodoDueDate} 
                        onChange={e => setNewTodoInputDueDate(e.target.value)}
                        className="flex-1 min-w-0 border border-gray-300 rounded px-2 py-1 text-xs focus:ring-2 focus:ring-blue-500 outline-none text-gray-800 bg-white font-medium"
                      />
                      <button type="submit" className="bg-blue-600 text-white font-bold text-xs px-3 py-1.5 rounded hover:bg-blue-700 shadow-sm shrink-0">+ Add Task</button>
                    </div>
                  </form>

                  <div className="max-h-52 overflow-y-auto space-y-2 pr-1 min-w-0">
                    {quickTodos.length === 0 ? (
                      <p className="text-xs text-gray-400 italic">No non-Jira tasks added yet.</p>
                    ) : (
                      quickTodos.map(todo => {
                        const isUrgent = !todo.done && isTodoWithinSevenDaysOrOverdue(todo.dueDate);
                        return (
                          <div 
                            key={todo.id} 
                            className={`flex items-start justify-between p-2 rounded border text-xs transition-all min-w-0 ${
                              isUrgent 
                                ? 'bg-red-50 border-red-300 text-red-950 font-semibold' 
                                : 'bg-gray-50 border-gray-200 text-gray-800'
                            }`}
                          >
                            <label className="flex items-start gap-2 flex-1 cursor-pointer min-w-0">
                              <input 
                                type="checkbox" 
                                checked={todo.done} 
                                onChange={() => toggleQuickTodo(todo.id)} 
                                className="w-3.5 h-3.5 text-blue-600 rounded mt-0.5 shrink-0"
                              />
                              <div className="flex flex-col flex-1 min-w-0">
                                <span className={`break-all whitespace-pre-wrap ${todo.done ? "line-through text-gray-400" : ""}`}>
                                  {todo.text}
                                </span>
                                {todo.dueDate && (
                                  <span className={`text-[10px] font-bold mt-1 ${
                                    todo.done ? 'text-gray-400 line-through' : isUrgent ? 'text-red-700 animate-pulse' : 'text-gray-500'
                                  }`}>
                                    📅 Due: {formatDateOnly(todo.dueDate)} {isUrgent && !todo.done ? '(Urgent)' : ''}
                                  </span>
                                )}
                              </div>
                            </label>
                            <button onClick={() => removeQuickTodo(todo.id)} className="text-gray-400 hover:text-red-500 font-bold pl-2 shrink-0">✕</button>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {/* FREEFORM NOTES TEXTAREA */}
                <div className="flex-1 flex flex-col space-y-2 min-w-0">
                  <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider">Raw Quick Notes</h3>
                  <textarea 
                    value={quickNotes}
                    onChange={handleNotesChange}
                    placeholder="Paste unformatted links, snippet notes, or draft thoughts here..." 
                    className="flex-1 w-full border border-gray-300 rounded p-3 text-xs bg-amber-50/50 text-gray-800 focus:ring-2 focus:ring-amber-400 outline-none resize-none font-mono leading-relaxed break-words"
                  ></textarea>
                </div>

                <div className="text-[10px] text-gray-400 text-center italic border-t pt-2">
                  ☁️ Synced to your Supabase account across all devices.
                </div>
              </div>
            </div>
          )}

          {/* HEADER BAR SHARES THE COLUMN THEME */}
          <div className={`flex flex-col md:flex-row justify-between items-stretch md:items-center mb-6 p-3 sm:p-4 rounded-xl shadow-lg border gap-3 transition-all ${colColor}`}>
            <div className="flex items-center justify-between md:justify-start gap-2 sm:gap-4">
              <div>
                <h1 className="text-xl sm:text-3xl font-bold">Jira Tracker</h1>
                <button onClick={() => supabase.auth.signOut()} className="text-xs font-bold text-red-500 hover:text-red-700 mt-0.5">
                  Log Out
                </button>
              </div>

              {/* SEARCH BAR FOR ALL FIELDS */}
              <div className="relative flex-1 max-w-[180px] sm:max-w-xs ml-2">
                <span className="absolute inset-y-0 left-0 flex items-center pl-2.5 text-gray-400">🔍</span>
                <input 
                  type="text" 
                  placeholder="Search titles, IDs..." 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className={`w-full pl-8 pr-7 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none font-medium shadow-sm ${
                    isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-900'
                  }`}
                  spellCheck="true"
                />
                {searchQuery && (
                  <button 
                    onClick={() => setSearchQuery('')}
                    className="absolute inset-y-0 right-0 pr-2 flex items-center text-xs font-bold text-gray-400 hover:text-red-500"
                  >
                    ✕
                  </button>
                )}
              </div>
            </div>

            <div className="flex items-center justify-between md:justify-end gap-2">
              
              {/* MOBILE VIEW LAYOUT TOGGLE (STACKED LIST VS KANBAN SWIPE) */}
              <button 
                onClick={() => setIsMobileStack(!isMobileStack)}
                className={`md:hidden px-2.5 py-1.5 rounded-lg text-xs font-bold border flex items-center gap-1 ${
                  isDarkMode ? 'bg-slate-800 border-slate-700 text-slate-200' : 'bg-white border-gray-300 text-gray-800'
                }`}
                title="Toggle Mobile View"
              >
                <span>{isMobileStack ? '📱 Stacked' : '↔️ Kanban'}</span>
              </button>

              <div className="flex items-center gap-2">
                {/* CLEAN 3-LINES HAMBURGER MENU DROPDOWN */}
                <div className="relative" ref={menuRef}>
                  <button 
                    onClick={() => setIsMenuOpen(!isMenuOpen)} 
                    className={`p-2 rounded-lg shadow font-bold text-base sm:text-lg flex items-center justify-center transition-all border ${
                      isDarkMode ? 'bg-slate-800 border-slate-700 hover:bg-slate-700 text-white' : 'bg-white border-gray-300 hover:bg-gray-100 text-gray-800'
                    }`}
                    title="Tools & Settings Menu"
                  >
                    ☰
                  </button>

                  {/* HAMBURGER DROPDOWN CONTENT */}
                  {isMenuOpen && (
                    <div className="absolute right-0 mt-2 w-72 bg-white rounded-xl shadow-2xl border border-gray-200 p-4 z-50 text-gray-900 space-y-4 text-xs font-medium">
                      
                      {/* ALERTS & EXPORT ACTIONS */}
                      <div className="flex items-center justify-between border-b pb-3">
                        <span className="font-bold text-gray-700">Actions</span>
                        <div className="flex items-center gap-2">
                          <button 
                            onClick={() => { requestNotificationAccess(); setIsMenuOpen(false); }} 
                            className={`p-1.5 rounded shadow font-bold text-xs flex items-center gap-1 ${
                              notificationPermission === 'granted' ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'
                            }`}
                            title="Alerts"
                          >
                            🔔 Alerts
                          </button>

                          <button 
                            onClick={() => { exportTasksCSV(); setIsMenuOpen(false); }}
                            className="p-1.5 rounded shadow font-bold text-xs bg-black hover:bg-gray-800 text-white flex items-center gap-1"
                            title="Export CSV"
                          >
                            💾 Export
                          </button>
                        </div>
                      </div>

                      {/* FILTER OPTIONS */}
                      <div className="space-y-1">
                        <label className="block font-bold text-gray-600 text-[10px] uppercase tracking-wider">Status Filter</label>
                        <select 
                          value={filterStatus} 
                          onChange={e => { setFilterStatus(e.target.value); setIsMenuOpen(false); }}
                          className="w-full border border-gray-300 rounded p-1.5 font-bold bg-white outline-none cursor-pointer text-xs"
                        >
                          <option value="ALL">All ({activeTasksCount})</option>
                          <option value="DUE_TODAY">📅 Today ({tasks.filter(t => (t.reminders || []).some(r => getReminderStatus(r.date) === 'DUE_TODAY')).length})</option>
                          <option value="OVERDUE">⚠️ Overdue ({tasks.filter(t => (t.reminders || []).some(r => getReminderStatus(r.date) === 'OVERDUE')).length})</option>
                          <option value="TYPE_DUE_DATE">📅 Due Dates ({tasks.filter(t => (t.reminders || []).some(r => r.type === 'Due Date')).length})</option>
                          <option value="TYPE_FOLLOWUP">📌 Follow-ups ({tasks.filter(t => (t.reminders || []).some(r => r.type === 'Follow-up')).length})</option>
                          <option value="PROJECTS_ONLY">📌 Projects ({tasks.filter(t => t.is_project).length})</option>
                        </select>
                      </div>

                      {/* THEMES OPTIONS */}
                      <div className="space-y-2 border-t pt-3">
                        <label className="block font-bold text-gray-600 text-[10px] uppercase tracking-wider">Appearance</label>
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-[11px] font-bold text-gray-700">Page Theme:</span>
                          <select 
                            value={bgColor} 
                            onChange={e => changeBgColor(e.target.value)}
                            className="border border-gray-300 rounded p-1 text-xs bg-white font-medium outline-none cursor-pointer w-32"
                          >
                            {BASIC_THEME_OPTIONS.map(c => (
                              <option key={c.name} value={c.bgValue}>{c.name}</option>
                            ))}
                          </select>
                        </div>

                        <div className="flex items-center justify-between gap-2">
                          <span className="text-[11px] font-bold text-gray-700">Columns Theme:</span>
                          <select 
                            value={colColor} 
                            onChange={e => changeColColor(e.target.value)}
                            className="border border-gray-300 rounded p-1 text-xs bg-white font-medium outline-none cursor-pointer w-32"
                          >
                            {BASIC_THEME_OPTIONS.map(c => (
                              <option key={c.name} value={c.colValue}>{c.name}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      {/* TEMPLATES POPUP */}
                      <div className="border-t pt-3">
                        <button 
                          onClick={() => { setIsTemplateModalOpen(true); setIsMenuOpen(false); }} 
                          className="w-full bg-indigo-600 text-white p-2 rounded shadow hover:bg-indigo-700 font-bold transition-all text-xs flex items-center justify-center gap-1.5"
                        >
                          <span>📋</span> Open Templates Manager
                        </button>
                      </div>

                    </div>
                  )}
                </div>

                {/* NEW JIRA BUTTON STAYS OUTSIDE THE MENU */}
                <button onClick={() => { setCurrentTask({ ...emptyTask }); setIsModalOpen(true); }} className="bg-blue-600 text-white px-3 sm:px-4 py-2 rounded shadow hover:bg-blue-700 font-bold transition-all text-xs sm:text-sm">
                  + New Jira
                </button>
              </div>
            </div>
          </div>

          {/* COLUMNS DISPLAY: RESPONSIVE STACK FOR MOBILE OR SWIPEABLE KANBAN FOR DESKTOP */}
          <div className={isMobileStack ? "flex flex-col gap-6" : "flex gap-4 sm:gap-6 overflow-x-auto pb-4"}>
            {COLUMNS.map(column => {
              const columnTasks = filteredTasks.filter(t => t.status === column);
              return (
                <div 
                  key={column} 
                  onDragOver={handleDragOver}
                  onDrop={e => handleDrop(e, column)}
                  className={`rounded-xl p-3 sm:p-4 border transition-all ${
                    isMobileStack ? "w-full" : "w-80 flex-shrink-0 flex flex-col max-h-[calc(100vh-200px)]"
                  } ${colColor}`}
                >
                  <h2 className="font-bold mb-3 border-b pb-2 text-xs sm:text-sm border-current opacity-90 flex-shrink-0">
                    {column} ({columnTasks.length})
                  </h2>
                  <div className="space-y-3 overflow-y-auto pr-1 flex-1 min-h-[60px]">
                    {columnTasks.map(task => {
                      const cardUrl = getFormattedUrl(task.jira_id);
                      const remindersList = task.reminders || [];
                      const highestStatus = getTaskHighestReminderStatus(remindersList);

                      let cardBgStyle = "bg-slate-100 border border-slate-300 text-slate-900 border-l-4 " + (COLUMN_BORDER_COLORS[column] || 'border-l-blue-600');
                      if (highestStatus === 'OVERDUE') {
                        cardBgStyle = "bg-red-50 border border-slate-300 text-red-950 border-l-4 border-l-red-600 ring-2 ring-red-500/40";
                      } else if (highestStatus === 'DUE_TODAY') {
                        cardBgStyle = "bg-purple-50 border border-slate-300 text-purple-950 border-l-4 border-l-purple-600 ring-2 ring-purple-500/40";
                      }

                      return (
                        <div 
                          key={task.id} 
                          draggable={draggableTaskId === task.id}
                          onDragStart={e => handleDragStart(e, task.id)}
                          onDragEnd={() => setDraggableTaskId(null)}
                          className={`jira-card p-3 sm:p-4 rounded-lg shadow cursor-pointer hover:shadow-lg transition-all transform hover:-translate-y-0.5 ${cardBgStyle}`} 
                          onClick={() => { setCurrentTask(task); setIsModalOpen(true); }}
                        >
                          <div className="flex justify-between items-center mb-2">
                            <div className="flex items-center gap-1.5 truncate max-w-[150px]">
                              {/* STRICT MOBILE DRAG HANDLE */}
                              <span 
                                className="text-gray-400 hover:text-gray-600 text-sm font-bold mr-1 cursor-grab active:cursor-grabbing p-1" 
                                title="Hold & drag to move"
                                onMouseDown={() => setDraggableTaskId(task.id)}
                                onTouchStart={() => setDraggableTaskId(task.id)}
                                onClick={e => e.stopPropagation()}
                              >
                                ⋮⋮
                              </span>
                              {task.is_project && (
                                <span className="w-2.5 h-2.5 bg-red-600 rounded-full flex-shrink-0 inline-block shadow-sm" title="Important Project"></span>
                              )}
                              {cardUrl ? (
                                <a 
                                  href={cardUrl} 
                                  target="_blank" 
                                  rel="noopener noreferrer" 
                                  onClick={e => e.stopPropagation()} 
                                  className="text-xs font-bold text-blue-600 hover:text-blue-800 no-underline truncate"
                                  title="Open Jira URL"
                                >
                                  {extractJiraID(task.jira_id)}
                                </a>
                              ) : (
                                <span className="text-xs font-bold text-blue-600 truncate">{extractJiraID(task.jira_id)}</span>
                              )}
                            </div>
                            <span className="text-[10px] text-gray-500 font-medium">{formatDate(task.created_at)}</span>
                          </div>

                          <div className="font-semibold text-gray-900 text-xs sm:text-sm line-clamp-2">{task.title || 'Untitled Task'}</div>

                          {/* PIPELINE MONTH BADGE */}
                          {task.pipeline_month && (
                            <div className="mt-2 text-[10px] font-bold border border-blue-200 bg-blue-100 text-blue-800 px-2 py-0.5 rounded flex items-center gap-1 w-fit">
                              <span>🗓️ Pipeline Month: {task.pipeline_month}</span>
                            </div>
                          )}

                            <div className="mt-1.5 text-[10px] sm:text-[11px] font-bold border border-emerald-300 bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded flex items-center gap-1 w-fit">
                              <span>🚀 Live:</span> {formatDateOnly(task.live_date)}
                            </div>
                          )}

                            const remStatus = getReminderStatus(rem.date);
                            const remType = rem.type || 'Reminder';

                            if (remStatus === 'OVERDUE') {
                              return (
                                <div key={rem.id || idx} className="mt-2 text-[10px] font-bold text-red-800 bg-red-100 border border-red-300 px-2 py-0.5 rounded flex items-center gap-1 w-fit animate-pulse">
                                  <span>⚠️ Overdue ({remType}):</span> {formatDate(rem.date)}
                                </div>

                            } else if (remStatus === 'DUE_TODAY') {
                              return (
                                <div key={rem.id || idx} className="mt-2 text-[10px] font-bold text-purple-900 bg-purple-100 border border-purple-300 px-2 py-0.5 rounded flex items-center gap-1 w-fit">
                                  <span>📅 Due Today ({remType}):</span> {formatDate(rem.date)}
                                </div>
                              );

                              return (

                                  remType === 'Follow-up' ? 'bg-teal-50 text-teal-800 border-teal-200' :
                                  'bg-slate-200 text-slate-700 border-slate-300'
                                }`}>
                                  <span>{remType === 'Due Date' ? '📅 Due Date:' : remType === 'Follow-up' ? '📌 Follow-up:' : '🕒 Reminder:'}</span> {formatDate(rem.date)}

                            return null;

          {isTemplateModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50">
              <div ref={templateModalRef} className="rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-4 sm:p-6 shadow-2xl space-y-4 sm:space-y-6 border bg-white border-gray-200 text-gray-900">
                <div className="flex justify-between items-center border-b pb-3 border-gray-200">
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold">Saved Template Spaces</h2>
                    <p className="text-[11px] sm:text-xs mt-0.5 text-gray-500">Saved directly in your Supabase database. Paste images & copy text instantly.</p>
                  </div>
                  <button onClick={() => setIsTemplateModalOpen(false)} className="text-gray-400 hover:text-red-500 font-bold text-xl">✕</button>
                </div>

                <div ref={templateListRef} className="space-y-4 sm:space-y-6 max-h-[55vh] overflow-y-auto pr-1">
                  {templateSpaces.map((space) => (
                    <div key={space.id} className="p-3 sm:p-4 border rounded-lg space-y-3 relative shadow-sm bg-gray-50 border-gray-200">
                      <div className="flex justify-between items-center gap-2">
                        <input 
                          type="text" 
                          className="font-bold border rounded px-2.5 py-1 text-xs sm:text-sm flex-1 focus:ring-2 focus:ring-blue-500 outline-none bg-white border-gray-300 text-gray-800" 
                          value={space.title || ''} 
                          onChange={e => updateTemplateSpace(space.id, 'title', e.target.value)} 
                          placeholder="Template Title" 
                          spellCheck="true"
                        />
                        <div className="flex items-center gap-1.5">
                          <button 
                            type="button" 
                            onClick={() => copyTemplateText(space)} 
                            className={`text-white text-xs font-bold px-2.5 py-1 rounded shadow-sm transition-all ${
                              copiedId === space.id ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-blue-600 hover:bg-blue-700'
                            }`}
                          >
                            {copiedId === space.id ? 'Copied! ✓' : 'Copy'}
                          </button>
                          <button 
                            type="button" 
                            onClick={() => removeTemplateSpace(space.id)} 
                            className="text-red-500 hover:text-red-700 font-bold text-sm px-1" 
                            title="Remove Space"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                      
                      {/* RICH EDITOR FOR TEMPLATE */}
                      <div>
                        <RichEditor 
                          id={`template-editor-${space.id}`} 
                          value={space.body || ''} 
                          onChange={val => updateTemplateSpace(space.id, 'body', val)} 
                        />
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex justify-between items-center border-t pt-4 border-gray-200">
                  <button 
                    onClick={addTemplateSpace} 
                    className="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded hover:bg-indigo-700 shadow-sm transition-all"
                  >
                    + Add Template
                  </button>
                  <button 
                    onClick={() => setIsTemplateModalOpen(false)} 
                    className="text-xs font-bold px-4 py-2 rounded transition-all bg-gray-200 text-gray-800 hover:bg-gray-300"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TASK DOCUMENT MODAL WINDOW - ALWAYS CLASSIC SLATE LIGHT */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-50">
              <div ref={modalRef} className="rounded-xl w-full max-w-4xl max-h-[92vh] overflow-y-auto p-4 sm:p-6 shadow-2xl border bg-white border-gray-200 text-gray-900">
                <div className="flex justify-between items-center mb-4 sm:mb-6 border-b pb-3 sm:pb-4 border-gray-200">
                  <div>
                    <h2 className="text-xl sm:text-2xl font-bold text-gray-900">Document Template</h2>
                    {currentTask.created_at && (
                      <p className="text-[10px] sm:text-xs mt-0.5 text-gray-500">Created: {formatDate(currentTask.created_at)}</p>
                    )}
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-red-500 font-bold text-xl">✕</button>
                </div>
                <div className="space-y-4 sm:space-y-6">
                  {/* MAIN FIELDS RESPONSIVE GRID */}
                  <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                    <div className="sm:col-span-3">
                      <label className="block text-xs font-bold mb-1 text-gray-700">Title</label>
                      <input 
                        type="text" 
                        className="w-full border p-2 rounded text-xs focus:ring-2 focus:ring-blue-500 outline-none bg-white border-gray-300 text-gray-900" 
                        value={currentTask.title || ''} 
                        onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, title: val})); }} 
                        spellCheck="true"
                      />
                    </div>
                    
                    <div className="sm:col-span-3">
                      <div className="flex justify-between items-center mb-1">
                        <label className="block text-xs font-bold text-gray-700">Jira Link/ID</label>
                        {getFormattedUrl(currentTask.jira_id) && (
                          <a 
                            href={getFormattedUrl(currentTask.jira_id)} 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="text-xs font-bold text-blue-600 hover:text-blue-800 no-underline"
                            title="Open Jira URL"
                          >
                            🔗
                          </a>
                        )}
                      </div>
                      <input 
                        type="text" 
                        className="w-full border p-2 rounded text-xs bg-white border-gray-300 text-gray-900" 
                        value={currentTask.jira_id || ''} 
                        onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, jira_id: val})); }} 
                        placeholder="Paste Jira URL or ID" 
                        spellCheck="false" 
                      />
                    </div>

                    <div className="sm:col-span-2">
                      <label className="block text-xs font-bold mb-1 text-gray-700">Status</label>
                      <select 
                        className="w-full border p-2 rounded text-xs bg-white border-gray-300 text-gray-900" 
                        value={currentTask.status || 'To Do'} 
                        onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, status: val})); }}
                      >
                        {COLUMNS.map(col => <option key={col} value={col}>{col}</option>)}
                      </select>
                    </div>

                    {/* PIPELINE MONTH SELECTOR */}
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-bold mb-1 text-gray-700">Pipeline Month</label>
                      <select 
                        className="w-full border p-1.5 rounded text-xs focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer bg-white border-gray-300 text-gray-900" 
                        value={currentTask.pipeline_month || ''} 
                        onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, pipeline_month: val})); }}
                      >
                        <option value="">None</option>
                        {MONTHS.map(m => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </div>

                    {/* TARGET LIVE DATE */}
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-bold mb-1 text-gray-700">Target Live Date</label>
                      <input 
                        type="date" 
                        className="w-full border p-1.5 rounded text-xs focus:ring-2 focus:ring-blue-500 outline-none font-medium cursor-pointer bg-white border-gray-300 text-gray-900" 
                        value={currentTask.live_date || ''} 
                        onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, live_date: val})); }} 
                      />
                    </div>
                  </div>

                  {/* PROJECT CHECKBOX ROW */}
                  <div className="flex justify-end">
                    <label className="flex items-center gap-1.5 cursor-pointer font-bold text-xs text-red-600 border border-red-200 px-3 py-1.5 rounded hover:bg-red-100 transition-colors bg-red-50">
                      <input 
                        type="checkbox" 
                        className="w-3.5 h-3.5 text-red-600 rounded focus:ring-red-500 cursor-pointer" 
                        checked={!!currentTask.is_project} 
                        onChange={e => { const checked = e.target.checked; setCurrentTask(prev => ({...prev, is_project: checked})); }} 
                      />
                      <span>Project</span>
                    </label>
                  </div>

                  {/* MULTI-REMINDER SECTION WITH AUTO-EXPANDING TEXTAREA */}
                  <div className="p-3 sm:p-4 border rounded-lg space-y-3 bg-purple-50 border-purple-200">
                    <div className="flex justify-between items-center">
                      <label className="block text-xs sm:text-sm font-bold flex items-center gap-1.5 text-purple-900">
                        <span>🔔</span> Reminders & Deadlines ({(currentTask.reminders || []).length})
                      </label>
                      <button 
                        type="button" 
                        onClick={addReminder} 
                        className="text-xs bg-purple-700 text-white font-bold px-2.5 py-1 rounded hover:bg-purple-800 transition-all shadow-sm"
                      >
                        + Add Reminder
                      </button>
                    </div>

                    {(currentTask.reminders || []).length === 0 ? (
                      <p className="text-xs text-purple-700 italic">No reminders set for this Jira yet.</p>
                    ) : (
                      <div className="space-y-2">
                        {(currentTask.reminders || []).map((rem, idx) => (
                          <div key={rem.id || idx} className="flex flex-col sm:flex-row gap-2 items-stretch sm:items-start bg-white p-2 border border-purple-200 rounded">
                            <div className="flex gap-2 items-center">
                              <select 
                                value={rem.type || 'Reminder'} 
                                onChange={e => updateReminder(rem.id, 'type', e.target.value)}
                                className="border rounded px-2 py-1 text-xs font-bold bg-white border-purple-300 text-purple-950 outline-none focus:ring-2 focus:ring-purple-500 cursor-pointer"
                              >
                                <option value="Reminder">🕒 Reminder</option>
                                <option value="Due Date">📅 Due Date</option>
                                <option value="Follow-up">📌 Follow-up</option>
                                <option value="Other">📝 Other</option>
                              </select>

                              <input 
                                type="datetime-local" 
                                className="flex-1 border p-1 rounded text-xs focus:ring-2 focus:ring-purple-500 outline-none font-medium cursor-pointer bg-white border-purple-300 text-gray-900" 
                                value={formatDatetimeLocal(rem.date)} 
                                onChange={e => updateReminder(rem.id, 'date', e.target.value)} 
                              />
                            </div>

                            <div className="flex gap-2 items-start flex-1 min-w-0">
                              <textarea 
                                rows="2"
                                className="flex-1 border p-1.5 rounded text-xs focus:ring-2 focus:ring-purple-500 outline-none bg-white border-purple-300 text-gray-900 resize-y font-sans leading-relaxed break-words min-w-0" 
                                placeholder="Free-text note..." 
                                value={rem.note || ''} 
                                onChange={e => updateReminder(rem.id, 'note', e.target.value)} 
                                spellCheck="true"
                              />

                              <button 
                                type="button" 
                                onClick={() => removeReminder(rem.id)} 
                                className="text-xs text-red-600 hover:text-red-800 font-bold px-1.5 pt-1 shrink-0"
                                title="Delete this reminder"
                              >
                                ✕
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs sm:text-sm font-bold mb-1 text-gray-700">What's The Problem Or Task</label>
                    <RichEditor id="editor-problem" value={currentTask.problem || ''} onChange={val => setCurrentTask(prev => ({...prev, problem: val}))} />
                  </div>

                  <div>
                    <label className="block text-xs sm:text-sm font-bold mb-1 text-gray-700">Where I Searched</label>
                    <RichEditor id="editor-searched" value={currentTask.searched || ''} onChange={val => setCurrentTask(prev => ({...prev, searched: val}))} />
                  </div>

                  <div>
                    <label className="block text-xs sm:text-sm font-bold mb-1 text-gray-700">Actions</label>
                    <RichEditor id="editor-actions" value={currentTask.actions || ''} onChange={val => setCurrentTask(prev => ({...prev, actions: val}))} />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs sm:text-sm font-bold mb-1 text-gray-700">Notes</label>
                      <RichEditor id="editor-notes" value={currentTask.notes || ''} onChange={val => setCurrentTask(prev => ({...prev, notes: val}))} />
                    </div>

                    <div>
                      <label className="block text-xs sm:text-sm font-bold mb-1 text-gray-700">Related Files</label>
                      <RichEditor id="editor-related" value={currentTask.related_files || ''} onChange={val => setCurrentTask(prev => ({...prev, related_files: val}))} />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs sm:text-sm font-bold mb-1 text-gray-700">Shelf Pages That Need Content</label>
                    <RichEditor id="editor-shelf" value={currentTask.shelf_pages || ''} onChange={val => setCurrentTask(prev => ({...prev, shelf_pages: val}))} />
                  </div>

                  <div>
                    <label className="block text-xs sm:text-sm font-bold mb-1 text-gray-700">Questions & Answers</label>
                    <RichEditor id="editor-qa" value={currentTask.qa || ''} onChange={val => setCurrentTask(prev => ({...prev, qa: val}))} />
                  </div>

                  <div className="p-3 sm:p-4 border rounded bg-blue-50 border-blue-200">
                    <div className="flex justify-between items-center mb-2">
                      <label className="block text-xs sm:text-sm font-bold text-blue-800">Response To Reporter</label>
                      <button 
                        type="button" 
                        onClick={appendNewResponse} 
                        className="text-[10px] sm:text-xs bg-blue-600 text-white font-bold px-2 py-1 rounded hover:bg-blue-700 transition-all shadow-sm"
                      >
                        + Append Response
                      </button>
                    </div>
                    <textarea 
                      className="w-full border p-2 rounded h-32 sm:h-40 font-mono text-xs sm:text-sm bg-white border-blue-200 text-gray-900" 
                      value={currentTask.reporter_response || ''} 
                      onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, reporter_response: val})); }}
                      spellCheck="true"
                    ></textarea>
                  </div>
                </div>

                <div className="mt-6 flex gap-3 border-t pt-4 border-gray-200">
                  {currentTask.id && (
                    <button onClick={deleteTask} className="px-3 sm:px-4 py-2 bg-red-100 text-red-700 font-bold rounded hover:bg-red-200 mr-auto text-xs sm:text-sm">
                      Delete
                    </button>
                  )}
                  <button onClick={() => setIsModalOpen(false)} className="px-3 sm:px-4 py-2 rounded font-bold ml-auto text-gray-600 hover:bg-gray-100 text-xs sm:text-sm">Cancel</button>
                  <button onClick={saveTask} className="px-4 sm:px-6 py-2 bg-green-600 text-white font-bold rounded hover:bg-green-700 text-xs sm:text-sm">Save Task</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(null);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => setSession(session));
        return () => subscription.unsubscribe();
      }, []);

      return !session ? <Auth /> : <WorkspaceTracker session={session} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
