<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Quill.js Rich Text Editor CSS & JS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <style>
    .ql-toolbar.ql-snow {
      border-top-left-radius: 0.375rem;
      border-top-right-radius: 0.375rem;
      background-color: #f9fafb;
      border-color: #d1d5db;
      padding: 4px 8px;
    }
    .ql-container.ql-snow {
      border-bottom-left-radius: 0.375rem;
      border-bottom-right-radius: 0.375rem;
      border-color: #d1d5db;
      font-family: inherit;
      background-color: #ffffff;
    }
    .ql-editor {
      min-height: 90px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://sjxyivhamzcmgflrraws.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Va3ZUBZzd02bDXB_3JbRLw_PgndY5gO';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const COLUMNS = ['To Do', 'Active Jiras', 'Waiting Jiras', 'Parked/Paused Jiras', 'Done/Closed'];
    
    // Column Border Colors
    const COLUMN_BORDER_COLORS = {
      'To Do': 'border-black',
      'Active Jiras': 'border-amber-400',
      'Waiting Jiras': 'border-slate-300',
      'Parked/Paused Jiras': 'border-purple-600',
      'Done/Closed': 'border-lime-400'
    };

    const UNIFIED_COLOR_OPTIONS = [
      { name: 'Mint Green', bgValue: 'bg-emerald-100', colValue: 'bg-emerald-100 border-emerald-300 text-emerald-950' },
      { name: 'Classic Gray', bgValue: 'bg-gray-100', colValue: 'bg-gray-200/90 border-gray-300 text-gray-800' },
      { name: 'Slate Blue', bgValue: 'bg-slate-200', colValue: 'bg-slate-200 border-slate-300 text-slate-900' },
      { name: 'Soft Blue', bgValue: 'bg-blue-100', colValue: 'bg-blue-100 border-blue-200 text-blue-950' },
      { name: 'Warm Amber', bgValue: 'bg-amber-100', colValue: 'bg-amber-100 border-amber-300 text-amber-950' },
      { name: 'Rose Pink', bgValue: 'bg-rose-100', colValue: 'bg-rose-100 border-rose-300 text-rose-950' },
      { name: 'Lavender', bgValue: 'bg-purple-100', colValue: 'bg-purple-100 border-purple-300 text-purple-950' },
      { name: 'Pure White', bgValue: 'bg-white', colValue: 'bg-white/95 border-gray-300 text-gray-900 shadow-md' },
      { name: 'Electric Blue', bgValue: 'bg-blue-600', colValue: 'bg-blue-600 border-blue-400 text-white shadow-lg' },
      { name: 'Deep Indigo', bgValue: 'bg-indigo-700', colValue: 'bg-indigo-700 border-indigo-500 text-white shadow-lg' },
      { name: 'Emerald Green', bgValue: 'bg-emerald-600', colValue: 'bg-emerald-600 border-emerald-400 text-white shadow-lg' },
      { name: 'Crimson Red', bgValue: 'bg-rose-600', colValue: 'bg-rose-600 border-rose-400 text-white shadow-lg' },
      { name: 'Sunset Orange', bgValue: 'bg-orange-500', colValue: 'bg-orange-500 border-orange-400 text-white shadow-lg' },
      { name: 'Golden Amber', bgValue: 'bg-amber-500', colValue: 'bg-amber-500 border-amber-600 text-amber-950 shadow-lg' },
      { name: 'Royal Violet', bgValue: 'bg-purple-700', colValue: 'bg-purple-700 border-purple-500 text-white shadow-lg' },
      { name: 'Hot Pink', bgValue: 'bg-fuchsia-600', colValue: 'bg-fuchsia-600 border-fuchsia-400 text-white shadow-lg' },
      { name: 'Deep Teal', bgValue: 'bg-teal-700', colValue: 'bg-teal-700 border-teal-500 text-white shadow-lg' },
      { name: 'Midnight Black', bgValue: 'bg-gray-950', colValue: 'bg-gray-950 border-gray-800 text-gray-100 shadow-xl' },
      { name: 'Dark Gray', bgValue: 'bg-gray-900', colValue: 'bg-gray-900 border-gray-800 text-gray-100 shadow-xl' },
      { name: 'Charcoal Blue', bgValue: 'bg-slate-900', colValue: 'bg-slate-900 border-slate-800 text-slate-100 shadow-xl' }
    ];

    const emptyTask = {
      title: '', jira_id: '', status: 'To Do', problem: '', searched: '',
      actions: '', notes: '', related_files: '', shelf_pages: '', qa: '',
      is_project: false,
      reporter_response: ''
    };

    function RichEditor({ id, value, onChange }) {
      const editorRef = useRef(null);
      const quillRef = useRef(null);

      useEffect(() => {
        if (editorRef.current && !quillRef.current) {
          quillRef.current = new window.Quill(editorRef.current, {
            theme: 'snow',
            modules: {
              toolbar: [
                [{ 'header': [1, 2, 3, false] }],
                ['bold', 'italic', 'underline', 'strike'],
                [{ 'color': [] }, { 'background': [] }],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                [{ 'align': [] }],
                ['link', 'image', 'clean']
              ]
            }
          });

          if (value) {
            quillRef.current.clipboard.dangerouslyPasteHTML(value);
          }

          quillRef.current.on('text-change', () => {
            const html = quillRef.current.root.innerHTML;
            onChange(html === '<p><br></p>' ? '' : html);
          });
        }
      }, []);

      return (
        <div className="w-full">
          <div ref={editorRef} id={id} />
        </div>
      );
    }

    function extractJiraID(input) {
      if (!input) return '';
      const match = input.match(/[A-Z]+-\d+/i);
      return match ? match[0].toUpperCase() : input;
    }

    function getFormattedUrl(input) {
      if (!input) return null;
      let trimmed = input.trim();
      if (!trimmed) return null;
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
        return trimmed;
      }
      return 'https://' + trimmed;
    }

    function Auth() {
      const [loading, setLoading] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isSignUp, setIsSignUp] = useState(false);
      const [message, setMessage] = useState('');

      const handleAuth = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage('');
        
        let error;
        if (isSignUp) {
          const res = await supabase.auth.signUp({ email, password });
          error = res.error;
          if (!error) setMessage('Success! You Can Now Log In.');
        } else {
          const res = await supabase.auth.signInWithPassword({ email, password });
          error = res.error;
        }

        if (error) setMessage(error.message);
        setLoading(false);
      };

      return (
        <div className="flex items-center justify-center min-h-screen bg-gray-200">
          <div className="bg-white p-8 rounded-lg shadow-xl w-96">
            <h2 className="text-3xl font-bold mb-6 text-center text-gray-800">{isSignUp ? 'Create Account' : 'Welcome Back'}</h2>
            {message && <p className="mb-4 text-sm text-center font-bold text-red-600">{message}</p>}
            
            <form onSubmit={handleAuth} className="space-y-4">
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Email</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-1">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required />
              </div>
              <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700 mt-4">
                {loading ? 'Processing...' : (isSignUp ? 'Sign Up' : 'Log In')}
              </button>
            </form>
            
            <p className="mt-6 text-sm text-center text-gray-600 cursor-pointer hover:text-blue-600 font-semibold" onClick={() => {setIsSignUp(!isSignUp); setMessage('');}}>
              {isSignUp ? 'Already Have An Account? Log In' : "Don't Have An Account? Sign Up"}
            </p>
          </div>
        </div>
      );
    }

    function WorkspaceTracker() {
      const [tasks, setTasks] = useState([]);
      const [templateSpaces, setTemplateSpaces] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isTemplateModalOpen, setIsTemplateModalOpen] = useState(false);
      const [currentTask, setCurrentTask] = useState(emptyTask);
      const [isLoading, setIsLoading] = useState(true);
      const [copiedId, setCopiedId] = useState(null);
      
      const [reminderDate, setReminderDate] = useState('');
      const [reminderNote, setReminderNote] = useState('');

      const [bgColor, setBgColor] = useState(() => {
        return localStorage.getItem('tracker_bg') || 'bg-blue-600';
      });

      const [colColor, setColColor] = useState(() => {
        return localStorage.getItem('tracker_col') || UNIFIED_COLOR_OPTIONS[1].colValue;
      });

      useEffect(() => { 
        fetchTasks(); 
        fetchTemplates();
      }, []);

      const changeBgColor = (colorClass) => {
        setBgColor(colorClass);
        localStorage.setItem('tracker_bg', colorClass);
      };

      const changeColColor = (colorClass) => {
        setColColor(colorClass);
        localStorage.setItem('tracker_col', colorClass);
      };

      const downloadIcsReminder = () => {
        if (!reminderDate) {
          alert("Please select a date and time for the reminder.");
          return;
        }

        const startDate = new Date(reminderDate);
        if (isNaN(startDate.getTime())) {
          alert("Invalid date selected.");
          return;
        }

        const endDate = new Date(startDate.getTime() + 15 * 60 * 1000); // 15 min event

        const formatDateIcs = (date) => {
          return date.toISOString().replace(/-|:|\.\d\d\d/g, '');
        };

        const jiraId = extractJiraID(currentTask.jira_id) || 'JIRA';
        const title = currentTask.title || 'Untitled Task';
        const jiraUrl = getFormattedUrl(currentTask.jira_id) || '';
        const summary = `Reminder: ${jiraId} - ${title}`;
        const description = `Jira ID: ${jiraId}\\nURL: ${jiraUrl}\\n\\nNote: ${reminderNote.replace(/\n/g, '\\n')}`;

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Jira Tracker//EN',
          'BEGIN:VEVENT',
          `UID:${Date.now()}@jiratracker.app`,
          `DTSTAMP:${formatDateIcs(new Date())}`,
          `DTSTART:${formatDateIcs(startDate)}`,
          `DTEND:${formatDateIcs(endDate)}`,
          `SUMMARY:${summary}`,
          `DESCRIPTION:${description}`,
          `LOCATION:${jiraUrl}`,
          'BEGIN:VALARM',
          'ACTION:DISPLAY',
          'DESCRIPTION:Reminder',
          'TRIGGER:-PT0M',
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `${jiraId}_Reminder.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const fetchTemplates = async () => {
        const { data, error } = await supabase.from('templates').select('*').order('created_at', { ascending: true });
        if (!error && data) {
          setTemplateSpaces(data);
        }
      };

      const addTemplateSpace = async () => {
        const newTemp = { title: 'New Template', body: '' };
        const { data, error } = await supabase.from('templates').insert([newTemp]).select();
        if (!error && data) {
          setTemplateSpaces(prev => [...prev, data[0]]);
        }
      };

      const updateTemplateSpace = async (id, field, value) => {
        setTemplateSpaces(prev => prev.map(s => s.id === id ? { ...s, [field]: value } : s));
        await supabase.from('templates').update({ [field]: value }).eq('id', id);
      };

      const removeTemplateSpace = async (id) => {
        if (window.confirm("Are you sure you want to delete this template from Supabase?")) {
          setTemplateSpaces(prev => prev.filter(s => s.id !== id));
          await supabase.from('templates').delete().eq('id', id);
        }
      };

      const copyTemplateText = async (space) => {
        const htmlContent = space.body || '';
        try {
          if (navigator.clipboard && window.ClipboardItem) {
            const blobHtml = new Blob([htmlContent], { type: 'text/html' });
            const tmp = document.createElement('div');
            tmp.innerHTML = htmlContent;
            const plainText = tmp.textContent || tmp.innerText || '';
            const blobText = new Blob([plainText], { type: 'text/plain' });

            const data = [new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })];
            await navigator.clipboard.write(data);
          } else {
            const textArea = document.createElement('textarea');
            textArea.value = htmlContent;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          }
          setCopiedId(space.id);
          setTimeout(() => setCopiedId(null), 2000);
        } catch (err) {
          alert("Failed to copy text. Please copy manually.");
        }
      };

      const fetchTasks = async () => {
        setIsLoading(true);
        const { data, error } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
        if (!error) setTasks(data || []);
        setIsLoading(false);
      };

      const saveTask = async () => {
        const payload = {
          title: currentTask.title || '',
          jira_id: currentTask.jira_id || '',
          status: currentTask.status || 'To Do',
          problem: currentTask.problem || '',
          searched: currentTask.searched || '',
          actions: currentTask.actions || '',
          notes: currentTask.notes || '',
          related_files: currentTask.related_files || '',
          shelf_pages: currentTask.shelf_pages || '',
          qa: currentTask.qa || '',
          is_project: !!currentTask.is_project,
          reporter_response: currentTask.reporter_response || ''
        };

        if (currentTask.id) {
          const { error } = await supabase.from('tasks').update(payload).eq('id', currentTask.id);
          if (error) alert("Save Failed: " + error.message);
        } else {
          const { error } = await supabase.from('tasks').insert([payload]);
          if (error) alert("Save Failed: " + error.message);
        }
        await fetchTasks();
        setIsModalOpen(false);
      };

      const deleteTask = async () => {
        if (window.confirm("Are You Sure You Want To Delete This Task? This Cannot Be Undone.")) {
          const { error } = await supabase.from('tasks').delete().eq('id', currentTask.id);
          if (error) {
            console.error("Error deleting:", error);
            alert("Failed To Delete Task.");
          } else {
            await fetchTasks();
            setIsModalOpen(false);
          }
        }
      };

      const appendNewResponse = () => {
        const timestamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
        const existing = currentTask.reporter_response || '';
        const prefix = existing.trim().length > 0 ? '\n\n' : '';
        const newResponseBlock = `${prefix}========================================\nRESPONSE (${timestamp})\n========================================\n`;
        setCurrentTask(prev => ({
          ...prev,
          reporter_response: (prev.reporter_response || '') + newResponseBlock
        }));
      };

      const formatDate = (isoString) => {
        if (!isoString) return '';
        return new Date(isoString).toLocaleString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        });
      };

      if (isLoading) return <div className="p-8 text-xl font-bold text-gray-700">Loading Your Secure Jira Tracker...</div>;

      return (
        <div className={`min-h-screen p-8 font-sans transition-colors duration-300 ${bgColor}`}>
          <div className="flex justify-between items-center mb-8 bg-white/90 backdrop-blur-md p-4 rounded-xl shadow-lg border border-white/20">
            <div>
              <h1 className="text-3xl font-bold text-gray-900">Jira Tracker</h1>
              <button onClick={() => supabase.auth.signOut()} className="text-sm font-bold text-red-600 hover:text-red-800 mt-1">
                Securely Log Out
              </button>
            </div>

            <div className="flex items-center gap-6">
              {/* STACKED SELECTORS: PAGE THEME & COLUMNS */}
              <div className="flex flex-col gap-1.5">
                <div className="flex items-center justify-between gap-2">
                  <span className="text-[10px] font-bold text-gray-700 uppercase tracking-wider">Page Theme:</span>
                  <select 
                    value={bgColor} 
                    onChange={e => changeBgColor(e.target.value)}
                    className="border border-gray-300 rounded px-1.5 py-0.5 text-xs bg-white font-medium focus:ring-1 focus:ring-blue-500 outline-none shadow-sm cursor-pointer min-w-[110px]"
                  >
                    {UNIFIED_COLOR_OPTIONS.map(c => (
                      <option key={c.name} value={c.bgValue}>{c.name}</option>
                    ))}
                  </select>
                </div>

                <div className="flex items-center justify-between gap-2">
                  <span className="text-[10px] font-bold text-gray-700 uppercase tracking-wider">Columns:</span>
                  <select 
                    value={colColor} 
                    onChange={e => changeColColor(e.target.value)}
                    className="border border-gray-300 rounded px-1.5 py-0.5 text-xs bg-white font-medium focus:ring-1 focus:ring-blue-500 outline-none shadow-sm cursor-pointer min-w-[110px]"
                  >
                    {UNIFIED_COLOR_OPTIONS.map(c => (
                      <option key={c.name} value={c.colValue}>{c.name}</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* TEMPLATES BUTTON */}
              <button 
                onClick={() => setIsTemplateModalOpen(true)} 
                className="bg-indigo-600 text-white px-3.5 py-2 rounded shadow hover:bg-indigo-700 font-bold transition-all text-xs flex items-center gap-1.5"
              >
                <span>📋</span> Templates
              </button>

              <button onClick={() => { setCurrentTask({ ...emptyTask }); setReminderDate(''); setReminderNote(''); setIsModalOpen(true); }} className="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 font-bold transition-all text-sm">
                + New Jira Task
              </button>
            </div>
          </div>

          <div className="flex gap-6 overflow-x-auto pb-4">
            {COLUMNS.map(column => (
              <div key={column} className={`rounded-xl p-4 w-80 flex-shrink-0 min-h-[500px] border transition-all ${colColor}`}>
                <h2 className="font-bold mb-4 border-b pb-2 text-sm border-current opacity-90">
                  {column} ({tasks.filter(t => t.status === column).length})
                </h2>
                <div className="space-y-4">
                  {tasks.filter(t => t.status === column).map(task => {
                    const cardUrl = getFormattedUrl(task.jira_id);
                    return (
                      <div 
                        key={task.id} 
                        className={`bg-white p-4 rounded-lg shadow cursor-pointer hover:shadow-lg border-l-4 ${COLUMN_BORDER_COLORS[column] || 'border-blue-600'} transition-all transform hover:-translate-y-0.5`} 
                        onClick={() => { setCurrentTask(task); setReminderDate(''); setReminderNote(''); setIsModalOpen(true); }}
                      >
                        <div className="flex justify-between items-center mb-2">
                          <div className="flex items-center gap-1.5 truncate max-w-[150px]">
                            {task.is_project && (
                              <span className="w-2.5 h-2.5 bg-red-600 rounded-full flex-shrink-0 inline-block shadow-sm" title="Important Project"></span>
                            )}
                            {cardUrl ? (
                              <a 
                                href={cardUrl} 
                                target="_blank" 
                                rel="noopener noreferrer" 
                                onClick={e => e.stopPropagation()} 
                                className="text-xs font-bold text-blue-600 hover:text-blue-800 no-underline truncate"
                                title="Open Jira URL"
                              >
                                {extractJiraID(task.jira_id)}
                              </a>
                            ) : (
                              <span className="text-xs font-bold text-blue-600 truncate">{extractJiraID(task.jira_id)}</span>
                            )}
                          </div>
                          <span className="text-[10px] text-gray-400">{formatDate(task.created_at)}</span>
                        </div>
                        <div className="font-semibold text-gray-900 line-clamp-2">{task.title || 'Untitled Task'}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* TEMPLATES MANAGER MODAL WINDOW */}
          {isTemplateModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl w-full max-w-3xl max-h-[85vh] overflow-y-auto p-6 shadow-2xl space-y-6">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h2 className="text-2xl font-bold text-gray-900">Saved Template Spaces</h2>
                    <p className="text-xs text-gray-500 mt-1">Saved directly in your Supabase database. Paste images (Ctrl+V) & copy content instantly.</p>
                  </div>
                  <button onClick={() => setIsTemplateModalOpen(false)} className="text-gray-500 hover:text-red-500 font-bold text-xl">✕</button>
                </div>

                <div className="space-y-6 max-h-[55vh] overflow-y-auto pr-2">
                  {templateSpaces.map((space) => (
                    <div key={space.id} className="bg-gray-50 p-4 border border-gray-200 rounded-lg space-y-3 relative shadow-sm">
                      <div className="flex justify-between items-center gap-4">
                        <input 
                          type="text" 
                          className="font-bold text-gray-800 bg-white border border-gray-300 rounded px-2.5 py-1 text-sm flex-1 focus:ring-2 focus:ring-blue-500 outline-none" 
                          value={space.title || ''} 
                          onChange={e => updateTemplateSpace(space.id, 'title', e.target.value)} 
                          placeholder="Template Title" 
                        />
                        <div className="flex items-center gap-2">
                          <button 
                            type="button" 
                            onClick={() => copyTemplateText(space)} 
                            className={`text-white text-xs font-bold px-3 py-1.5 rounded shadow-sm transition-all ${
                              copiedId === space.id ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-blue-600 hover:bg-blue-700'
                            }`}
                          >
                            {copiedId === space.id ? 'Copied! ✓' : 'Copy Text'}
                          </button>
                          <button 
                            type="button" 
                            onClick={() => removeTemplateSpace(space.id)} 
                            className="text-red-500 hover:text-red-700 font-bold text-sm px-1.5" 
                            title="Remove Space"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                      
                      {/* RICH EDITOR FOR TEMPLATE */}
                      <div>
                        <RichEditor 
                          id={`template-editor-${space.id}`} 
                          value={space.body || ''} 
                          onChange={val => updateTemplateSpace(space.id, 'body', val)} 
                        />
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex justify-between items-center border-t pt-4">
                  <button 
                    onClick={addTemplateSpace} 
                    className="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded hover:bg-indigo-700 shadow-sm transition-all"
                  >
                    + Add Template Space
                  </button>
                  <button 
                    onClick={() => setIsTemplateModalOpen(false)} 
                    className="bg-gray-200 text-gray-800 text-xs font-bold px-4 py-2 rounded hover:bg-gray-300 transition-all"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TASK DOCUMENT MODAL WINDOW */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-6 border-b pb-4">
                  <div>
                    <h2 className="text-2xl font-bold text-gray-900">Document Template</h2>
                    {currentTask.created_at && (
                      <p className="text-xs text-gray-500 mt-1">Created: {formatDate(currentTask.created_at)}</p>
                    )}
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-500 hover:text-red-500 font-bold text-xl">✕</button>
                </div>
                <div className="space-y-6">
                  <div className="flex gap-4 items-center">
                    <div className="flex-1">
                      <label className="block text-sm font-bold text-gray-700 mb-1">Title</label>
                      <input type="text" className="w-full border border-gray-300 p-2 rounded" value={currentTask.title || ''} onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, title: val})); }} />
                    </div>
                    
                    {/* JIRA LINK/ID INPUT WITH ICON-ONLY LINK BUTTON */}
                    <div className="w-1/3">
                      <div className="flex justify-between items-center mb-1">
                        <label className="block text-sm font-bold text-gray-700">Jira Link/ID</label>
                        {getFormattedUrl(currentTask.jira_id) && (
                          <a 
                            href={getFormattedUrl(currentTask.jira_id)} 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="text-sm font-bold text-blue-600 hover:text-blue-800 no-underline"
                            title="Open Jira URL"
                          >
                            🔗
                          </a>
                        )}
                      </div>
                      <input type="text" className="w-full border border-gray-300 p-2 rounded" value={currentTask.jira_id || ''} onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, jira_id: val})); }} placeholder="Paste Jira URL or ID" />
                    </div>

                    <div className="w-1/4">
                      <label className="block text-sm font-bold text-gray-700 mb-1">Status</label>
                      <select className="w-full border border-gray-300 p-2 rounded" value={currentTask.status || 'To Do'} onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, status: val})); }}>
                        {COLUMNS.map(col => <option key={col} value={col}>{col}</option>)}
                      </select>
                    </div>
                    <div className="flex items-center gap-2 pt-6">
                      <label className="flex items-center gap-2 cursor-pointer font-bold text-xs text-red-600 bg-red-50 border border-red-200 px-3 py-2.5 rounded hover:bg-red-100 transition-colors">
                        <input 
                          type="checkbox" 
                          className="w-4 h-4 text-red-600 rounded focus:ring-red-500 cursor-pointer" 
                          checked={!!currentTask.is_project} 
                          onChange={e => { const checked = e.target.checked; setCurrentTask(prev => ({...prev, is_project: checked})); }} 
                        />
                        <span>Project</span>
                      </label>
                    </div>
                  </div>

                  {/* NATIVE CALENDAR REMINDER SECTION */}
                  <div className="bg-purple-50 p-4 border border-purple-200 rounded-lg space-y-3">
                    <div className="flex justify-between items-center">
                      <label className="block text-sm font-bold text-purple-900 flex items-center gap-1.5">
                        <span>📅</span> Create Calendar Reminder
                      </label>
                      <button 
                        type="button" 
                        onClick={downloadIcsReminder} 
                        className="text-xs bg-purple-700 text-white font-bold px-3 py-1.5 rounded hover:bg-purple-800 transition-all shadow-sm flex items-center gap-1"
                      >
                        <span>📥</span> Download Calendar Reminder
                      </button>
                    </div>
                    <div className="flex gap-3">
                      <input 
                        type="datetime-local" 
                        className="w-1/3 border border-purple-300 p-2 rounded text-xs bg-white focus:ring-2 focus:ring-purple-500 outline-none font-medium" 
                        value={reminderDate} 
                        onChange={e => setReminderDate(e.target.value)} 
                      />
                      <input 
                        type="text" 
                        className="flex-1 border border-purple-300 p-2 rounded text-xs bg-white focus:ring-2 focus:ring-purple-500 outline-none" 
                        placeholder="Free-text note for calendar event (e.g., Check with team on draft response)..." 
                        value={reminderNote} 
                        onChange={e => setReminderNote(e.target.value)} 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">What's The Problem Or Task</label>
                    <RichEditor id="editor-problem" value={currentTask.problem || ''} onChange={val => setCurrentTask(prev => ({...prev, problem: val}))} />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Where I Searched</label>
                    <RichEditor id="editor-searched" value={currentTask.searched || ''} onChange={val => setCurrentTask(prev => ({...prev, searched: val}))} />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Actions</label>
                    <RichEditor id="editor-actions" value={currentTask.actions || ''} onChange={val => setCurrentTask(prev => ({...prev, actions: val}))} />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">Notes</label>
                      <RichEditor id="editor-notes" value={currentTask.notes || ''} onChange={val => setCurrentTask(prev => ({...prev, notes: val}))} />
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">Related Files</label>
                      <RichEditor id="editor-related" value={currentTask.related_files || ''} onChange={val => setCurrentTask(prev => ({...prev, related_files: val}))} />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Shelf Pages That Need Content</label>
                    <RichEditor id="editor-shelf" value={currentTask.shelf_pages || ''} onChange={val => setCurrentTask(prev => ({...prev, shelf_pages: val}))} />
                  </div>

                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1">Questions & Answers</label>
                    <RichEditor id="editor-qa" value={currentTask.qa || ''} onChange={val => setCurrentTask(prev => ({...prev, qa: val}))} />
                  </div>

                  <div className="bg-blue-50 p-4 border border-blue-200 rounded">
                    <div className="flex justify-between items-center mb-2">
                      <label className="block text-sm font-bold text-blue-800">Response To Reporter</label>
                      <button 
                        type="button" 
                        onClick={appendNewResponse} 
                        className="text-xs bg-blue-600 text-white font-bold px-2.5 py-1 rounded hover:bg-blue-700 transition-all shadow-sm"
                      >
                        + Append Another Response
                      </button>
                    </div>
                    <textarea 
                      className="w-full border border-blue-200 p-2 rounded h-40 font-mono text-sm bg-white" 
                      value={currentTask.reporter_response || ''} 
                      onChange={e => { const val = e.target.value; setCurrentTask(prev => ({...prev, reporter_response: val})); }}
                    ></textarea>
                  </div>
                </div>

                <div className="mt-6 flex gap-4 border-t pt-4">
                  {currentTask.id && (
                    <button onClick={deleteTask} className="px-4 py-2 bg-red-100 text-red-700 font-bold rounded hover:bg-red-200 mr-auto">
                      Delete Task
                    </button>
                  )}
                  <button onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-bold ml-auto">Cancel</button>
                  <button onClick={saveTask} className="px-6 py-2 bg-green-600 text-white font-bold rounded hover:bg-green-700">Save Task</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(null);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => setSession(session));
        return () => subscription.unsubscribe();
      }, []);

      return !session ? <Auth /> : <WorkspaceTracker />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
